"uid":"merged-mvcj8yua-42","sourceNo":118,"originalSourceNo":118,"manualOrder":39,"workspaceFixedOrder":39,"lockedOrder":39,"orderLocked":true,"start":399.77,"end":401.48,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":39,"readerNo":40,"displayNo":40,"n":40,"cueNo":40,"uniqueCueNo":40,"finalCueNo":40,"originalDisplayNo":40,"type":"dialogue","vi":"Chặn thông điệp lan tỏa thì dễ như bỡn.\nCó phải dân chuyên không thì làm việc sẽ biết thôi.\nAnh tìm hiểu chưa? Vâng, tôi đã tìm thử.\nGiám đốc Hwang trước đây từng là chủ tịch của Hiệp hội PR.\nKINH NGHIỆM CHỦ TỊCH HIỆP HỘI PR KỲ 26\nNghe nói anh ta là số một Hàn Quốc trong lĩnh vực quản lý rủi ro.\nNăm ngoái, Tập đoàn Woowon đã thu mua công ty PR của Giám đốc Hwang với một số tiền khá lớn thì phải.\nVậy tức là anh ta không phải tên ngốc không biết gì.\nCó chuyện gì sao?\nWoowon định làm truyền thông doanh nghiệp.\nTrong tình cảnh này sao?\nHơn nữa, càng sớm càng tốt. Chi phí là 30 tỷ.","ko":"황석우: 메시지를 막기만 하는 건 하수지\n황석우: 진짜 꾼인지는 일해 보면 드러나겠지\n고아인: 알아봤어?\n한병수: 예, 찾아봤더니\n한병수: 황석우 전무가 전직 PR협회 회장 출신이랍니다\n한병수: 특히 뭐, 리스크 관리 쪽은 대한민국 최고라고 하고요\n한병수: 작년에 우원에서 황 전무가 운영하던\n한병수: PR 홍보 회사를 꽤 큰 금액으로 인수했다고 하네요?\n고아인: 그럼 아무것도 모르는 바보는 아니란 소리인데\n한병수: 혹시 무슨 일 때문에 그러세요?\n고아인: 우원그룹 기업 PR 한다는데?\n한병수: 이 시점에 기업 PR을요?\n고아인: 그것도 최대한 빨리 빌링 300억","en":"Stopping the message from spreading is an easy job.\nI guess working with her will show us if she's truly a pro.\nDid you look into him? Yes, I looked him up.\nHe's the former chairman of the National PR Association.\nEXPERIENCES NATIONAL PR ASSOCIATION 26TH CHAIRMAN\nHe's the best in the country for risk management.\nLast year, Woowon Group took over his PR agency.\nAnd apparently, they offered him a hefty sum of money for it.\nWhich means he's not a complete fool.\nIs something up?\nWoowon is doing a corporate PR.\nReally? In this situation?\nAnd as soon as possible. The billing is 30 billion.","text":"Chặn thông điệp lan tỏa thì dễ như bỡn.\nCó phải dân chuyên không thì làm việc sẽ biết thôi.\nAnh tìm hiểu chưa? Vâng, tôi đã tìm thử.\nGiám đốc Hwang trước đây từng là chủ tịch của Hiệp hội PR.\nKINH NGHIỆM CHỦ TỊCH HIỆP HỘI PR KỲ 26\nNghe nói anh ta là số một Hàn Quốc trong lĩnh vực quản lý rủi ro.\nNăm ngoái, Tập đoàn Woowon đã thu mua công ty PR của Giám đốc Hwang với một số tiền khá lớn thì phải.\nVậy tức là anh ta không phải tên ngốc không biết gì.\nCó chuyện gì sao?\nWoowon định làm truyền thông doanh nghiệp.\nTrong tình cảnh này sao?\nHơn nữa, càng sớm càng tốt. Chi phí là 30 tỷ.\\n황석우:  메시지를 막기만 하는 건 하수지\n황석우:  진짜 꾼인지는 일해 보면 드러나겠지\n고아인:  알아봤어?\n한병수:  예, 찾아봤더니\n한병수:  황석우 전무가 전직 PR협회 회장 출신이랍니다\n한병수:  특히 뭐, 리스크 관리 쪽은 대한민국 최고라고 하고요\n한병수:  작년에 우원에서 황 전무가 운영하던\n한병수:  PR 홍보 회사를 꽤 큰 금액으로 인수했다고 하네요?\n고아인:  그럼 아무것도 모르는 바보는 아니란 소리인데\n한병수:  혹시 무슨 일 때문에 그러세요?\n고아인:  우원그룹 기업 PR 한다는데?\n한병수:  이 시점에 기업 PR을요?\n고아인:  그것도 최대한 빨리 빌링 300억\\nStopping the message from spreading is an easy job.\nI guess working with her will show us if she's truly a pro.\nDid you look into him? Yes, I looked him up.\nHe's the former chairman of the National PR Association.\nEXPERIENCES NATIONAL PR ASSOCIATION 26TH CHAIRMAN\nHe's the best in the country for risk management.\nLast year, Woowon Group took over his PR agency.\nAnd apparently, they offered him a hefty sum of money for it.\nWhich means he's not a complete fool.\nIs something up?\nWoowon is doing a corporate PR.\nReally? In this situation?\nAnd as soon as possible. The billing is 30 billion.","sourceUid":"merged-mvcjcb32-48","uid":"merged-mvcjcb32-48","sourceNo":119,"originalSourceNo":119,"manualOrder":40,"workspaceFixedOrder":40,"lockedOrder":40,"orderLocked":true,"start":347.934206,"end":434.915236,"viRange":{"start":347.934206,"end":401.692241},"koRange":{"start":382.263553,"end":434.915236},"viRanges":[{"start":347.934206,"end":401.692241}],"koRanges":[{"start":382.263553,"end":434.915236}],"speakerSegments":[{"index":0,"start":382.264,"end":385.212,"text":"메시지를 막기만 하는 건 하수지","speed":1,"cueUid": ship with the press.\nRight. That's a part of it.\nBut if that's his goal, all he has to do is air more ads that are currently running.","text":"Không hợp lý chút nào.\nĐúng vậy. Khi gặp bê bối thì phải dừng mọi quảng cáo.\nĐó là lẽ thường trong ngành. Vậy hay là thế này?\nAnh ta chi mạnh quảng cáo để duy trì quan hệ tốt đẹp với cánh báo chí.\nĐúng vậy. Đó là một phần.\nNhưng… Với mục đích đó thì chỉ cần cho tăng số quảng cáo hiện giờ là đủ rồi.\\n한병수:  이거 진짜 말이 안 되는데 그렇지\n고아인:  '부정적 이슈가 있을 땐 광고 마케팅을 중단한다' 이건 업계 상식인데\n한병수:  그러면 혹시\n한병수:  광고비 늘려서 언론이랑 우호적인 관계를 유지하겠다. 뭐, 그런 건가요?\n고아인:  그렇지, 그것도 있지\n고아인:  근데 그 목적이면 지금 하고 있는 광고 물량만 늘리면 되지\\nThis doesn't make sense.\nYou're right. When you're in hot water, you pause all your marketing in advertising.\nThat's the norm.\nThen how about this?\nHe'll pay more for the ads, so maybe he's looking to build a good relationship with the press.\nRight. That's a part of it.\nBut if that's his goal, all he has to do is air more ads that are currently running.","sourceUid":"merged-mvhn2e7a-13","uid":"merged-mvhn2e7a-13","sourceNo":129,"originalSourceNo":129,"manualOrder":42,"workspaceFixedOrder":42,"lockedOrder":42,"orderLocked":true,"start":401.692241,"end":463.165033,"viRange":{"start":401.692241,"end":429.241175},"koRange":{"start":434.915236,"end":463.165033},"viRanges":[{"start":401.692241,"end":429.241175}],"koRanges":[{"start":434.915236,"end":463.165033}],"speakerSegments":[{"index":0,"start":435.745,"end":438.256,"text":"이거 진짜 말이 안 되는데 그렇지","speed":1,"cueUid":"merged-mvhn2e7a-13","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":1,"start":438.256,"end":444.113,"text":"'부정적 이슈가 있을 땐 광고 마케팅을 중단한다' 이건 업계 상식인데","speed":1,"cueUid":"merged-mvhn2e7a-13","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":444.113,"end":447.883,"text":"그러면 혹시","speed":1,"cueUid":"merged-mvhn2e7a-13","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "}, nTôi bình tĩnh nổi chắc?\nTôi đã rèn luyện tâm trí để bỏ qua chuyện ngày đầu đi làm.\nTôi đã nhẫn nhịn đấy!\nNhưng rồi ở buổi phỏng vấn về ngày đầu đi làm mà tôi nỗ lực chuẩn bị,\ntrước mặt bao phóng viên khác,\nanh ta đã lên kế hoạch và cố ý bôi tro trét trấu lên mặt tôi!\\n최창수, 강한나:  한나 상무님 일단 진정을… 지금 진정하게 생겼어요?\n강한나:  내가 첫 출근 날 있었던 일은\n강한나:  심신 수련을 해서 참았어요 참았다고, 내가!\n강한나:  근데 내 첫 출근 홍보한다고 열심히 준비해서\n강한나:  기자들 모아서 인터뷰하는데\n강한나:  거기다 대고 의도적이고 계획적으로 똥물을 뿌리고!\\nMs. Kang. Please calm down first and--\nDo you think I can?\nI held in my anger for what happened on my first day by training my mind.\nI was holding it in!\nAnd then I went on for an interview about my first day at work\nwith all the reporters in the office.\nBut you intentionally sabotaged my interview!","sourceUid":"merged-mvia3t3k-10","uid":"merged-mvia3t3k-10","sourceNo":172,"originalSourceNo":172,"manualOrder":49,"workspaceFixedOrder":49,"lockedOrder":49,"orderLocked":true,"start":534.596283,"end":590.720494,"viRange":{"start":534.596283,"end":563.143074},"koRange":{"start":569.134638,"end":590.720494},"viRanges":[{"start":534.596283,"end":563.143074}],"koRanges":[{"start":569.134638,"end":590.720494}],"speakerSegments":[{"index":0,"start":569.135,"end":573.608,"text":"한나 상무님 일단 진정을… 지금 진정하게 생겼어요?","speed":1,"cueUid":"merged-mvia3t3k-10","speakerIds":["AGENCY-002","AGENCY-003"],"speakerNames":["최창수","강한나"],"speakerLabel":"최창수, 강한나:  "},{"index":1,"start":573.608,"end":575.789,"text":"내가 첫 출근 날 있었던 일은","speed":1,"cueUid":"merged-mvia3t3k-10","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":2,"start":575.789,"end":579.033,"text":"심신 수련을 해서 참았어요 참았다고, 내가!","speed":1,"cueUid":"merged-mvia3t3k-10","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":3,"start":579.033,"end":583.694,"text":"근데 내 첫 출근 홍보한다고 열심히 준비해서","speed":1,"cueUid":"merged-mvia3t3k-10","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":4,"star 요?\n최창수: 아닙니다, 뭔가 오해가…\n박영우: 예? 최 상무님이 시키셨다고 하던데요\n권우철: 예, 저는 그, 최 상무님이…\n최창수: 야! 어디 낄 데 못 낄 데 구분 못 하고!","en":"Ms. Kang. How could I have--\nHow bad can you be at your job?\nNo, ma'am. I think there's a misunderstanding--\nHe said it was your idea, Mr. Choi.\nSorry? Well, I did this because Mr. Choi--\nHey! This isn't your place to talk!","text":"Giám đốc Kang. Để tôi giải thích…\nThật là! Anh làm việc kiểu gì vậy?\nKhông. Cô đang hiểu nhầm rồi…\nAnh ấy bảo đó là chỉ thị của anh.\nSao cơ? Tôi làm vậy là vì Giám đốc Choi…\nNày! Đây là chỗ cho cậu chõ miệng vào à?\\n최창수:  상무님, 제가 설마…\n강한나:  아니! 지금 일을 어떻게 하시는 거예요?\n최창수:  아닙니다, 뭔가 오해가…\n박영우:  예? 최 상무님이 시키셨다고 하던데요\n권우철:  예, 저는 그, 최 상무님이…\n최창수:  야! 어디 낄 데 못 낄 데 구분 못 하고!\\nMs. Kang. How could I have--\nHow bad can you be at your job?\nNo, ma'am. I think there's a misunderstanding--\nHe said it was your idea, Mr. Choi.\nSorry? Well, I did this because Mr. Choi--\nHey! This isn't your place to talk!","sourceUid":"merged-mvia69c1-18","uid":"merged-mvia69c1-18","sourceNo":183,"originalSourceNo":183,"manualOrder":52,"workspaceFixedOrder":52,"lockedOrder":52,"orderLocked":true,"start":563.143074,"end":616.460918,"viRange":{"start":563.143074,"end":582.912151},"koRange":{"start":596.826222,"end":616.460918},"viRanges":[{"start":563.143074,"end":582.912151}],"koRanges":[{"start":596.826222,"end":616.460918}],"speakerSegments":[{"index":0,"start":596.826,"end":598.985,"text":"상무님, 제가 설마…","speed":1,"cueUid":"merged-mvia69c1-18","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":1,"start":598.985,"end":602.143,"text":"아니! 지금 일을 어떻게 하시는 거예요?","speed":1,"cueUid":"merged-mvia69c1-18","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":2,"start":602.143,"end":606.05,"text":"아닙니다, 뭔가 오해가…","speed":1,"cueUid":"merged-mvia69c1-18","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":3,"start":606.05,"end":608.244,"text":"예? 최 상무님이 시키셨다고 하던데요" urceNo":191,"originalSourceNo":191,"manualOrder":54,"workspaceFixedOrder":54,"lockedOrder":54,"orderLocked":true,"start":669.21,"end":671.29,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":54,"readerNo":55,"displayNo":55,"n":55,"cueNo":55,"uniqueCueNo":55,"finalCueNo":55,"originalDisplayNo":55,"type":"dialogue","vi":"Chuyện này là thế nào?\nNgười gửi email là Giám đốc Kang Han Na sao?\nAnh bảo là Giám đốc Go mà.\nCó vẻ như Giám đốc Kang đã ra chỉ thị đó.\nNếu chúng ta nghe lời Giám đốc Choi và khiếu nại thì…\nRời khỏi đây đã. Đứng đây khéo bị vạ lây mất.\nĐi thôi. Thật tình. Đi nào.\nLà ai? Sao? Ai là người bảo anh làm vậy?\nÝ cô là gì? Ai là người bảo anh cho gọi giám đốc công ty con đến để làm tôi mất mặt hả?","ko":"보험상무: 이게 무슨 일입니까?\n보험상무: 메일 강한나 상무님이 보낸 거예요?\n건설상무: 고아인 상무가 보낸 거라면서요\n본사상무: 한나 상무님이 시킨 일 같던데\n본사상무: 최 상무 조언대로 찾아가서 항의를 했으면\n본사상무: 일단 갑시다 괜히 여기 있다간 불똥 튀니까\n본사상무: 가죠 자, 가시죠\n강한나: 누구예요? 예?\n강한나: 최 상무님한테 시킨 사람은 누구냐고요\n최창수: 씁, 무슨…\n강한나: 계열사 임원들까지 불러서","en":"What happened? The one who sent the email was Ms. Kang?\nYou said Director Go was behind it.\nIt seemed like Ms. Kang ordered her to send out the email.\nIf we listened to Director Choi and complained about the email…\nLet's get out of here. The arrows may point to us if we stay.\nLet's leave. What an incident. Let's go. Let's go.\nWho was it? Sao? Sorry? Who told you to put these up?\nWhat do you mean?\nWho told you to call the subsidiary executives just so that I would be humiliated?","text":"Chuyện này là thế nào?\nNgười gửi email là Giám đốc Kang Han Na sao?\nAnh bảo là Giám đốc Go mà.\nCó vẻ như Giám đốc Kang đã ra chỉ thị đó.\nNếu chúng ta nghe lời Giám đốc Choi và khiếu nại thì…\nRời khỏi đây đã. Đứng đây khéo bị vạ lây mất.\nĐi thôi. Thật tình. Đi nào.\nLà ai? Sao? Ai là người bảo anh làm vậy?\nÝ cô là gì? Ai là người bảo anh cho gọi giám đốc công ty con đến để làm tôi mất mặt hả?\\n보험상무:  이게 무슨 일입니까?\n보험상무:  메일 강한나 상무님이 보낸 거예요?\n건설상무:  고아인 상무가 보낸 거라면서요\n본사상무:  한나 상무님이 시킨 일 같던데\n본사상무:  최 상무 조언대로 찾아가서 항의를 했으면\n본사상무:  일단 갑시다 괜히 여기 있다간 불똥 튀니까\n본사상무:  가죠 자, 가시죠\n강한나:  누구예요? 예?\n강한나:  최 상무님한테 시킨 사람은 누구냐고요\n최창수:  씁, 무슨…\n강한나:  계열사 임원들까지 불러서\\nWhat happened? The one who sent the email was Ms. Kang?\nYou said Director Go was behind it.\nIt seemed like Ms. Kang ordered her to send out the email.\nIf we listened to Director Choi and complained about the email…\nLet's get out of here. The arrows may point to us if we stay.\nLet's leave. What an incident. Let's go. Let's go.\nWho was it? Sao? Sorry? Who told you to put these up?\nWhat do you mean?\nWho told you to call the subsidiary executives just so that I would be humiliated?","sourceUid":"merged-mviadvti-30","uid":"merged-mviadvti-30","sourceNo":205,"originalSourceNo":205,"manualOrder":55,"workspaceFixedOrder":55,"lockedOrder":55,"orderLocked":true,"start":607.419,"end":695.4,"viRange":{"start":607.419,"end":664.274882},"koRange":{"start":657.874875,"end":695.4},"viRanges":[{"start":607.419,"end":664.274882}],"koRanges":[{"start":657.874875,"end":695.4}],"speakerSegments":[{"index":0,"start":657.875,"end":659.548,"text":"이게 무슨 일입니까?","speed":1,"cueUid":"merged-mviadvti-30","speakerIds":["sp-mviytkuu-1"],"speakerNames":["보험상무"],"speakerLabel":"보험상무:  "},{"index":1,"start":659.548,"end":662.915,"text":"메일 강한나 상무님이 보낸 거예요?","speed":1,"cueUid":"merged-mviadvti-30","speakerIds":["sp-mviytkuu-1"],"speakerNames":["보험상무"],"speakerLabel":"보험상무:  "},{"index":2,"start":662.915,"end":664.845,"text":"고아인 상무가 보낸 거라면서요","speed":1,"cueUid":"merged-mviadvti-30","speakerIds":["sp-mviyw76u-2"],"speakerNames":["건설상무"],"speakerLabel":"건설상무:  "},{"index":3,"start":664.845,"end":669.625,"text":"한나 상무님이 시킨 일 같던데","speed":1,"cueUid":"merged-mviadvti-30","speakerIds":["sp-mv52qwt9-1"],"speakerNames":["본사상무"],"speakerLabel":"본사상무:  "},{"index":4,"start":669.625,"end":674.426,"text":"최 상무 조언대로 찾아가서 항의를 했으면","speed":1,"cueUid":"merged-mviadvti-30","speakerIds":["sp-mv52qwt9-1"],"speakerNames":["본사상무"],"sp "finalCueNo":57,"originalDisplayNo":57,"type":"dialogue","vi":"Phải có người đứng sau chứ!\nSao tôi lại phải ngấm ngầm hại cô chứ?\nVậy thì… anh định ngấm ngầm hại ai?\nSao? Là anh tôi sai anh làm à?\nAnh không bao biện được câu nào\ntức là đúng rồi chứ gì? Đúng không?\nTrò gì không giở, lại sai anh dán ba cái thứ đó. Không phải đâu.\nTôi còn chưa từng gặp mặt phó tổng giám đốc.\nVậy anh có thù hằn gì với tôi mà lại sai anh ta bày trò này hả?","ko":"강한나: 다 보는 앞에서 나 엿 먹이라고 시킨 사람 있을 거 아니에요! \n최창수: 제가 왜 한나 상무님을 음해하겠습니까\n박영우: 그럼 누굴 음해하신 겁니까?\n최창수: 예?\n강한나: 오빠가 시킨 거예요?\n최창수: 예, 예? 어…\n강한나: 아무 말도 못 하는 게\n강한나: 맞지? 맞잖아\n강한나: 기껏 한다는 게 저런 유치한 거나 붙이고\n최창수: 아니요, 상무님 전 부사장님이랑 일면식도 없습니다\n강한나: 그럼 나한테 무슨 악감정이 있길래 저런 짓거리를 시킨 거냐고요!","en":"Tell me! Why would I try to slander you?\nThen… who did you try to slander?\nSao? Sorry? Is my brother behind this?\nCat got your tongue?\nSo it's my brother. Isn't it?\nIt's so childish of him to post these stupid posters. \nNo, ma'am. I've never even met the vice president.\nThen why in the world did you have him put these up?","text":"Phải có người đứng sau chứ!\nSao tôi lại phải ngấm ngầm hại cô chứ?\nVậy thì… anh định ngấm ngầm hại ai?\nSao? Là anh tôi sai anh làm à?\nAnh không bao biện được câu nào\ntức là đúng rồi chứ gì? Đúng không?\nTrò gì không giở, lại sai anh dán ba cái thứ đó. Không phải đâu.\nTôi còn chưa từng gặp mặt phó tổng giám đốc.\nVậy anh có thù hằn gì với tôi mà lại sai anh ta bày trò này hả?\\n강한나:  다 보는 앞에서 나 엿 먹이라고 시킨 사람 있을 거 아니에요! \n최창수:  제가 왜 한나 상무님을 음해하겠습니까\n박영우:  그럼 누굴 음해하신 겁니까?\n최창수:  예?\n강한나:  오빠가 시킨 거예요?\n최창수:  예, 예? 어…\n강한나:  아무 말도 못 하는 게\n강한나:  맞지? 맞잖아\n강한나:  기껏 한다는 게 저런 유치한 거나 붙이고\n최창수:  아니요, 상무님 전 부사장님이랑 일면식도 없습니다\n강한나:  그럼 나한테 무슨 악감정이 있길래 저런 짓거리를 시킨 거냐고요!\\nTell me! Why would I try to slander you?\nThen… who did you try to slander?\nSao? Sorry? Is my brother behind this?\nCat got your tongue?\nSo it's my brother. Isn't it?\nIt's so childish of him to post these stupid posters. \nNo, ma'am. I've never even met the vice president.\nThen why in the world did you have him put these up?","sourceUid":"merged-mviz4s6b-15","uid":"merged-mviz4s6b-15","sourceNo":222,"originalSourceNo":222,"manualOrder":57,"workspaceFixedOrder":57,"lockedOrder":57,"orderLocked":true,"start":664.274882,"end":742.066075,"viRange":{"start":664.274882,"end":708.648215},"koRange":{"start":711.89972,"end":742.066075},"viRanges":[{"start":664.274882,"end":708.648215}],"koRanges":[{"start":711.89972,"end":742.066075}],"speakerSegments":[{"index":0,"start":null,"end":null,"text":"다 보는 앞에서 나 엿 먹이라고 시킨 사람 있을 거 아니에요!","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":1,"start":null,"end":null,"text":"제가 왜 한나 상무님을 음해하겠습니까","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":2,"start":null,"end":null,"text":"그럼 누굴 음해하신 겁니까?","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":3,"start":711.9,"end":712.002,"text":"예?","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":4,"start":716.231,"end":718.269,"text":"오빠가 시킨 거예요?","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":5,"start":718.269,"end":722.28,"text":"예, 예? 어…","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":6,"start":724.346,"end":727.826,"text":"아무 말도 못 하는 게","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":7,"start":727.826,"end":730.238,"text":"맞지? 맞잖아","speed":1,"cueUid":"merged-mviz4s6b-15","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":8,"start":730.238,"end":733.599,"text":"기껏 한다는 게 저런 유치한 거나 붙이고","spe  most useless piece.\nActually, this is difficult to say.\nThis incident was caused due to Director Kwon's personal dissatisfaction with the recent demotion.\nMr. Choi. I had repeatedly told him not to do anything stupid.\nYou expect me to believe that?","text":"Kang Han Na đúng là con bé điên.\nCó cách gì không đây?\nPhải cắt bỏ nhánh cây mục thôi.\nThật ra, chuyện này hơi khó nói.\nVụ việc này là do thù oán cá nhân của Quản lý Kwon với quyết định cách chức mới đây.\nGiám đốc Choi. Tôi đã…\nbảo cậu ta đừng làm chuyện vớ vẩn không biết bao nhiêu lần rồi.\nAnh bảo tôi tin chuyện đó sao?\\n최창수:  강한나 저거 완전 돌아이네\n최창수:  방법 있나\n최창수:  썩은 가지 쳐 내야지\n최창수:  사실은… 참 이런 얘기 꺼내긴 그런데\n최창수:  이번 일은 저번 인사에 대한 권 CD의 개인적인 원한으로\n최창수:  사, 상무님 제가 허튼짓하지 말라고 그렇게 신신당부를 했는데\n강한나:  나보고 그걸 믿으라는 거예요?\\nMan, she's such a lunatic.\nI guess I have no choice.\nIt's time to cut off the most useless piece.\nActually, this is difficult to say.\nThis incident was caused due to Director Kwon's personal dissatisfaction with the recent demotion.\nMr. Choi. I had repeatedly told him not to do anything stupid.\nYou expect me to believe that?","sourceUid":"merged-mvizjmu6-24","uid":"merged-mvizjmu6-24","sourceNo":235,"originalSourceNo":235,"manualOrder":59,"workspaceFixedOrder":59,"lockedOrder":59,"orderLocked":true,"start":712.577169,"end":796.993854,"viRange":{"start":712.577169,"end":763.686842},"koRange":{"start":746.682402,"end":796.993854},"viRanges":[{"start":712.577169,"end":763.686842}],"koRanges":[{"start":746.682402,"end":796.993854}],"speakerSegments":[{"index":0,"start":746.682,"end":749.312,"text":"강한나 저거 완전 돌아이네","speed":1,"cueUid":"merged-mvizjmu6-24","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":1,"start":749.312,"end":752.493,"text":"방법 있나","speed":1,"cueUid":"merged-mvizjmu6-24","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":2,"start":756.052,"end":758.702,"text":"썩은 가지 쳐 내야지","speed":1,"cueUid":"merged-mvizjmu6-24",  당장\n조문호: 뭐, 일단 대충 상황 파악은 된 것 같네요. 그렇죠?\n최창수: 어쨌든 회사에서 소란 일으킨 점\n최창수: 제가 대신해서 진심으로 사죄드립니다\n조문호: 일단 한나 상무님은 방으로 돌아가셔서 화를 좀 삭이시죠\n강한나, 조문호: 아니, 지금… 한나 상무님\n조문호: 회사에서 계속 이렇게 큰 소리 내실 겁니까?","en":"Mr. Park. No. Mr. Cho. Fire him. Immediately.\nWell, I think we've figured out the situation.\nWhat do you say?\nAnyway, I offer my sincere apologies for causing a commotion on his behalf.\nMs. Kang, please return to your office and cool off first.\nBut-- Ms. Kang.\nAre you going to keep causing a commotion?","text":"Trợ lý Park. Không. Chú. Ngay lập tức.\nTrước mắt, có vẻ chúng ta đã nắm được sự tình rồi.\nĐúng không? Dù sao thì tôi cũng thay mặt cậu ta chân thành xin lỗi cô vì đã gây ra rắc rối cho cô.\nGiám đốc Kang cứ về văn phòng và hạ hỏa trước đã.\nNhưng… Giám đốc Kang.\nCô định tiếp tục gây náo loạn ở đây sao?\\n강한나:  박 차장, 아니지. 아저씨? 저거 잘라요. 당장\n조문호:  뭐, 일단 대충 상황 파악은 된 것 같네요. 그렇죠?\n최창수:  어쨌든 회사에서 소란 일으킨 점\n최창수:  제가 대신해서 진심으로 사죄드립니다\n조문호:  일단 한나 상무님은 방으로 돌아가셔서 화를 좀 삭이시죠\n강한나, 조문호:  아니, 지금… 한나 상무님\n조문호:  회사에서 계속 이렇게 큰 소리 내실 겁니까?\\nMr. Park. No. Mr. Cho. Fire him. Immediately.\nWell, I think we've figured out the situation.\nWhat do you say?\nAnyway, I offer my sincere apologies for causing a commotion on his behalf.\nMs. Kang, please return to your office and cool off first.\nBut-- Ms. Kang.\nAre you going to keep causing a commotion?","sourceUid":"merged-mvizscha-31","uid":"merged-mvizscha-31","sourceNo":248,"originalSourceNo":248,"manualOrder":61,"workspaceFixedOrder":61,"lockedOrder":61,"orderLocked":true,"start":763.686842,"end":859.983072,"viRange":{"start":763.686842,"end":826.475855},"koRange":{"start":799.076122,"end":859.983072},"viRanges":[{"start":763.686842,"end":826.475855}],"koRanges":[{"start":799.076122,"end":859.983072}],"speakerSegments":[{"index":0,"start":799.076,"end":810.027,"text":"박 차장, 아니지. 아저씨? 저거 잘라요. 당장","speed":1,"cueUid":"merged-mvizscha-31","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":1,"start":815.066,  in mind.\nI apologize, sir.\nYou may leave. Yes, sir.","sourceUid":"merged-mvj0ieq8-38","uid":"merged-mvj0ieq8-38","sourceNo":268,"originalSourceNo":268,"manualOrder":64,"workspaceFixedOrder":64,"lockedOrder":64,"orderLocked":true,"start":867.090955,"end":953.892173,"viRange":{"start":867.090955,"end":914.438379},"koRange":{"start":901.490106,"end":953.892173},"viRanges":[{"start":867.090955,"end":914.438379}],"koRanges":[{"start":901.490106,"end":953.892173}],"speakerSegments":[{"index":0,"start":901.49,"end":912.023,"text":"두 분. 두 분 서로 경쟁하는 건 괜찮습니다.","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-006"],"speakerNames":["조문호"],"speakerLabel":"조문호:  "},{"index":1,"start":912.023,"end":920.245,"text":"회사야 원래 그런 데니까 다만 두 분 싸움에 한나 상무를 이용하는 건","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-006"],"speakerNames":["조문호"],"speakerLabel":"조문호:  "},{"index":2,"start":920.245,"end":923.285,"text":"제가 용서하지 않습니다","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-006"],"speakerNames":["조문호"],"speakerLabel":"조문호:  "},{"index":3,"start":927.68,"end":932.212,"text":"링에선 선수끼리 싸워야지. 관객을 끌어들이면 되겠습니까?","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-006"],"speakerNames":["조문호"],"speakerLabel":"조문호:  "},{"index":4,"start":932.212,"end":934.342,"text":"새겨듣겠습니다","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":5,"start":936.632,"end":943.914,"text":"죄송합니다","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":6,"start":943.914,"end":953.892,"text":"자, 나가 보세요, 예","speed":1,"cueUid":"merged-mvj0ieq8-38","speakerIds":["AGENCY-006"],"speakerNames":["조문호"],"speakerLabel":"조문호:  "}]},{"id":64,"readerNo":65,"displayNo":65,"n":65,"cueNo":65,"uniqueCueNo":65,"finalCueNo":65,"originalDisplayNo":65,"type":"narration","vi":"[âm nhạc đen tối]\n[Changsu hắng giọng]\n[Tiếng đóng cửa]\n[Âm thanh thao tác n gments":[]},{"id":73,"readerNo":74,"displayNo":74,"n":74,"cueNo":74,"uniqueCueNo":74,"finalCueNo":74,"originalDisplayNo":74,"type":"dialogue","vi":"Chuyện này là thế nào?\nTôi cũng không hiểu sao lại như vậy.\nChuyện email là ý tưởng của Giám đốc Kang sao?\nKhông, đó là… Không gì mà không?\nNếu chúng tôi khiếu nại như anh bảo\nthì đã thành gây sự với con gái chủ tịch rồi.\nGiám đốc Choi, anh điên rồi à?","ko":"최창수: 예, 상무님\n본사상무: 지금 뭐 하는 겁니까\n최창수: 저도 왜 상황이…\n본사상무: 이번 일 한나 상무님이 주도한 거라면서요?\n최창수, 본사상무: 아니요, 그런… 아니긴 뭐가 아니에요!\n본사상무: 우리가 찾아가서 컴플레인 걸었으면\n본사상무: 회장님 따님하고 각을 세우는 건데!\n건설상무: 최 상무! 미친 겁니까?","en":"What just happened earlier?\nI have no idea why this happened.\nSo I heard the emails were Ms. Kang's idea.\nNo, that's-- What do you mean?\nIf we followed through and expressed our complaints,\nwe would've caused bad blood with the chairman's daughter.\nHave you lost your mind, Director Choi?","text":"Chuyện này là thế nào?\nTôi cũng không hiểu sao lại như vậy.\nChuyện email là ý tưởng của Giám đốc Kang sao?\nKhông, đó là… Không gì mà không?\nNếu chúng tôi khiếu nại như anh bảo\nthì đã thành gây sự với con gái chủ tịch rồi.\nGiám đốc Choi, anh điên rồi à?\\n최창수:  예, 상무님\n본사상무:  지금 뭐 하는 겁니까\n최창수:  저도 왜 상황이…\n본사상무:  이번 일 한나 상무님이 주도한 거라면서요?\n최창수, 본사상무:  아니요, 그런… 아니긴 뭐가 아니에요!\n본사상무:  우리가 찾아가서 컴플레인 걸었으면\n본사상무:  회장님 따님하고 각을 세우는 건데!\n건설상무:  최 상무! 미친 겁니까?\\nWhat just happened earlier?\nI have no idea why this happened.\nSo I heard the emails were Ms. Kang's idea.\nNo, that's-- What do you mean?\nIf we followed through and expressed our complaints,\nwe would've caused bad blood with the chairman's daughter.\nHave you lost your mind, Director Choi?","sourceUid":"merged-mvj4gapz-8","uid":"merged-mvj4gapz-8","sourceNo":321,"originalSourceNo":321,"manualOrder":74,"workspaceFixedOrder":74,"lockedOrder":74,"orderLocked":true,"start":1058.111338,"end":1110.603612,"viRange":{"start":1058.111338,"end":1076.701481},"koRange":{"start":1090.203149,"end":1110.603612},"viRanges":[{"start":105  일 반드시 책임질 날이 올 겁니다","en":"I mean, this situation…\nBy any chance, are you trying to use us to get on the chief creative officer's nerves?\nI would never-- A day will come when you'll have to take responsibility for today.","text":"Nghe này, tình cảnh này…\nHay là… anh định lợi dụng chúng tôi để cản trở giám đốc sáng tạo?\nTuyệt đối không có… Rồi sẽ có ngày anh phải chịu trách nhiệm vì chuyện hôm nay.\\n건설상무:  아니, 이게…\n본사상무:  혹시 우리 이용해서 제작 본부장 견제하는 거예요?\n본사상무:  절대 그런 일… 이번 일 반드시 책임질 날이 올 겁니다\\nI mean, this situation…\nBy any chance, are you trying to use us to get on the chief creative officer's nerves?\nI would never-- A day will come when you'll have to take responsibility for today.","sourceUid":"merged-mvjhf8ej-5","uid":"merged-mvjhf8ej-5","sourceNo":326,"originalSourceNo":326,"manualOrder":75,"workspaceFixedOrder":75,"lockedOrder":75,"orderLocked":true,"start":1076.701481,"end":1127.144675,"viRange":{"start":1076.701481,"end":1093.330877},"koRange":{"start":1110.603612,"end":1127.144675},"viRanges":[{"start":1076.701481,"end":1093.330877}],"koRanges":[{"start":1110.603612,"end":1127.144675}],"speakerSegments":[{"index":0,"start":1111.018,"end":1113.275,"text":"아니, 이게…","speed":1,"cueUid":"merged-mvjhf8ej-5","speakerIds":["sp-mviyw76u-2"],"speakerNames":["건설상무"],"speakerLabel":"건설상무:  "},{"index":1,"start":1113.275,"end":1121.368,"text":"혹시 우리 이용해서 제작 본부장 견제하는 거예요?","speed":1,"cueUid":"merged-mvjhf8ej-5","speakerIds":["sp-mv52qwt9-1"],"speakerNames":["본사상무"],"speakerLabel":"본사상무:  "},{"index":2,"start":1121.368,"end":1127.145,"text":"절대 그런 일… 이번 일 반드시 책임질 날이 올 겁니다","speed":1,"cueUid":"merged-mvjhf8ej-5","speakerIds":["sp-mv52qwt9-1"],"speakerNames":["본사상무"],"speakerLabel":"본사상무:  "}]},{"id":75,"readerNo":76,"displayNo":76,"n":76,"cueNo":76,"uniqueCueNo":76,"finalCueNo":76,"originalDisplayNo":76,"type":"narration","vi":"[âm thanh kết thúc cuộc gọi] [nhạc tối]\n[âm thanh chán nản]\n[thở dài]\n[Thở gấp]","ko":"[통화 종료음] [어두운 음악]\n[답답한 소리]\n[한숨]\n[거친 숨소리]","en":"[cal so much.\nI should talk respectfully to you now.\nThat'd be weird. I've known you since when I was a kid.\nJust call me casually.\nHan-na, you want me to stick the straw in for you too?","text":"Giám đốc Kang, Tổng giám đốc bảo tôi chuyển lời đến cô.\nChú ấy bảo gì? Không sao đâu. Cô cứ nói tự nhiên.\n\"Han Na à, chú cắm ống hút cho cháu như khi còn nhỏ nhé?\"\nVậy thôi ạ.\nCháu lớn lên nhiều quá. Giờ chú phải dùng kính ngữ với cháu thôi.\nVậy thì ngại lắm. Chú biết cháu từ khi cháu còn nhỏ mà.\nChú cứ gọi thoải mái đi ạ.\nHan Na à, chú cắm ống hút cho cháu như khi còn nhỏ nhé?\\n비서:  상무님, 대표님께서 이렇게 말씀 전해 달라고…\n강한나, 박영우:  뭐라고요? 괜찮습니다. 편하게 말씀 전해 주세요\n비서:  '한나야, 빨대도 꽂아 줄까?'라고\n조문호:  길에서 만나면 몰라보겠어 이제 존대해야겠네\n강한나:  음, 바나나우유에 빨대 꽂아 주시던 분인데 어색하게\n강한나:  편하게 부르세요\n조문호:  한나야, 빨대도 꽂아 줄까?\\nMs. Kang, the CEO also told me to deliver you a message.\nWhat did he say? It's okay. You can convey the message.\n\"Han-na, you want me to stick the straw in for you too?\"\nThat's all.\nYou've grown so much.\nI should talk respectfully to you now.\nThat'd be weird. I've known you since when I was a kid.\nJust call me casually.\nHan-na, you want me to stick the straw in for you too?","sourceUid":"merged-mvjhoaqx-16","uid":"merged-mvjhoaqx-16","sourceNo":342,"originalSourceNo":342,"manualOrder":78,"workspaceFixedOrder":78,"lockedOrder":78,"orderLocked":true,"start":1120.250772,"end":1193.676561,"viRange":{"start":1120.250772,"end":1160.885909},"koRange":{"start":1154.30491,"end":1193.676561},"viRanges":[{"start":1120.250772,"end":1160.885909}],"koRanges":[{"start":1154.30491,"end":1193.676561}],"speakerSegments":[{"index":0,"start":1154.305,"end":1158.154,"text":"상무님, 대표님께서 이렇게 말씀 전해 달라고…","speed":1,"cueUid":"merged-mvjhoaqx-16","speakerIds":["sp-mvj3hdd7-20"],"speakerNames":["비서"],"speakerLabel":"비서:  "},{"index":1,"start":1158.154,"end":1166.284,"text":"뭐라고요? 괜찮습니다. 편하게 말씀 전해 주세요","speed":1,"cueUid":"merged-mvjhoaqx-16","speakerIds":["AGENCY-003","AGENCY-004"],"speakerNames":["강한나","박영우"]  sao vậy?\\n강한나:  회사 생활 아주 재밌어지겠어\n강한나:  두근두근하네 속 태워 드릴 생각 하니까\n직원:  축하드립니다. 은정 님 승진 축하드립니다\n직원:  CD님, 축하드려요. 고마워. 부장님들, 빨리 오세요\n직원:  자, 다들 모이세요\n직원:  좋은 일 같이 축하해야죠 어서, 어서. 오늘 회식할까요? 자, 두 분도 어서 와서 촛불 부세요.\\nMy life at the company is about to get interesting.\nMy heart is racing, thinking of them staying on their toes for me.\nCongratulations. Congratulations. Congratulations on your promotion. Congratulations.\nThanks. Come, everyone!\nGather here, everyone! Let's celebrate together.\nCome on. Congratulations.\nBoth of you come and blow out the candles.\nWhat's up with him?","sourceUid":"merged-mvjn7u34-19","uid":"merged-mvjn7u34-19","sourceNo":393,"originalSourceNo":393,"manualOrder":85,"workspaceFixedOrder":85,"lockedOrder":85,"orderLocked":true,"start":1358.958553,"end":1427.733268,"viRange":{"start":1358.958553,"end":1393.608984},"koRange":{"start":1394.601476,"end":1427.733268},"viRanges":[{"start":1358.958553,"end":1393.608984}],"koRanges":[{"start":1394.601476,"end":1427.733268}],"speakerSegments":[{"index":0,"start":1394.601,"end":1396.821,"text":"회사 생활 아주 재밌어지겠어","speed":1,"cueUid":"merged-mvjn7u34-19","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":1,"start":1396.821,"end":1401.701,"text":"두근두근하네 속 태워 드릴 생각 하니까","speed":1,"cueUid":"merged-mvjn7u34-19","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":2,"start":1406.26,"end":1411.293,"text":"축하드립니다. 은정 님 승진 축하드립니다","speed":1,"cueUid":"merged-mvjn7u34-19","speakerIds":["sp-mvhmo7da-1"],"speakerNames":["직원"],"speakerLabel":"직원:  "},{"index":3,"start":1411.293,"end":1417.415,"text":"CD님, 축하드려요. 고마워. 부장님들, 빨리 오세요","speed":1,"cueUid":"merged-mvjn7u34-19","speakerIds":["sp-mvhmo7da-1"],"speakerNames":["직원"],"speakerLabel":"직원:  "},{"index":4,"start":1417.415,"end":1419.043,"text":"자, 다들 모이세요","speed":1,"cueUid":"merged-mvjn7u34-19","speakerIds":["sp-mvhmo7da-1"],"speakerNames":["직원"],"speakerLabel":"직원:  "},{"index":5,"start":1419.043,"end":1 병수:  아, 은정 CD가 불어\n조은정:  아이고, 찬물도 위아래가 있죠. 한 CD님이 하시죠\n한병수, 조은정:  레이디 퍼스트. 아이고, 노약자 퍼스트\n서장우:  에헤. 아무나 빨리 끄세요, 팔 아프니까\n같이 해, 그럼, 자. 네 하나, 둘, 셋! 둘, 셋!\\nCreative Director Cho, blow them out.\nCome on. I know how to respect my elders. Go ahead, Creative Director Han.\nLadies first. Elders first. Hey.\nMy arms hurt. Just do it.\nTogether then. Okay. One, two… Two…","sourceUid":"merged-mvjok00y-26","uid":"merged-mvjok00y-26","sourceNo":403,"originalSourceNo":403,"manualOrder":87,"workspaceFixedOrder":87,"lockedOrder":87,"orderLocked":true,"start":1393.608984,"end":1449.418,"viRange":{"start":1393.608984,"end":1415.175585},"koRange":{"start":1427.733268,"end":1449.418},"viRanges":[{"start":1393.608984,"end":1415.175585}],"koRanges":[{"start":1427.733268,"end":1449.418}],"speakerSegments":[{"index":0,"start":1433.843,"end":1435.446,"text":"아, 은정 CD가 불어","speed":1,"cueUid":"merged-mvjok00y-26","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":1,"start":1435.446,"end":1440.02,"text":"아이고, 찬물도 위아래가 있죠. 한 CD님이 하시죠","speed":1,"cueUid":"merged-mvjok00y-26","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":2,"start":1440.02,"end":1442.998,"text":"레이디 퍼스트. 아이고, 노약자 퍼스트","speed":1,"cueUid":"merged-mvjok00y-26","speakerIds":["AGENCY-011","AGENCY-005"],"speakerNames":["한병수","조은정"],"speakerLabel":"한병수, 조은정:  "},{"index":3,"start":1442.998,"end":1445.732,"text":"에헤. 아무나 빨리 끄세요, 팔 아프니까","speed":1,"cueUid":"merged-mvjok00y-26","speakerIds":["AGENCY-012"],"speakerNames":["서장우"],"speakerLabel":"서장우:  "},{"index":4,"start":1445.732,"end":1449.418,"text":"같이 해, 그럼, 자. 네 하나, 둘, 셋! 둘, 셋!","speed":1,"cueUid":"merged-mvjok00y-26","speakerIds":[],"speakerNames":[],"speakerLabel":""}]},{"id":87,"readerNo":88,"displayNo":88,"n":88,"cueNo":88,"uniqueCueNo":88,"finalCueNo":88,"originalDisplayNo":88,"type":"dialogue","vi":"Ba! Khoan đã. Chờ một lát. Quản lý sáng tạo Bae.\nLại đây đi. Đúng rồi. Còn cô ấy mà.\nMau lên! Nhanh lên. Tất 챙겨 주시고\n조은정: 아유, 상무님 비서면 다 같이 우리 팀이죠\n정수정: 계시죠? 네. 계약직인 나도. 다 같이 우리 팀…","en":"I think she'll be busy.\nThat's a risky move.\nSomeone's a creative director now.\nSorry? Me. Congratulations. You didn't need to include me.\nWe're all part of a team if you're Ms. Go's secretary.\nIs she in? Yes. A temporary worker like me is also part of a team?","text":"Có vẻ cô ấy sẽ bận bịu lâu đấy.\nNguy hiểm quá. Lên quản lý sáng tạo rồi. Dạ? Tôi ấy.\nChúc mừng chị. Đâu cần mời cả tôi đâu.\nThư ký của Giám đốc Go cũng là thành viên của đội mà.\nChị ấy ở trong chứ? Vâng.\nNhân viên hợp đồng như mình cũng là thành viên của đội ư?\\n한병수:  씁, 한창 일하고 계실 텐데. 위험한데\n조은정:  CD 됐거든요. 네? 나. 아…\n정수정:  아, 축하드려요. 뭘 저까지 챙겨 주시고\n조은정:  아유, 상무님 비서면 다 같이 우리 팀이죠\n정수정:  계시죠? 네. 계약직인 나도. 다 같이 우리 팀…\\nI think she'll be busy.\nThat's a risky move.\nSomeone's a creative director now.\nSorry? Me. Congratulations. You didn't need to include me.\nWe're all part of a team if you're Ms. Go's secretary.\nIs she in? Yes. A temporary worker like me is also part of a team?","sourceUid":"merged-mvkdcpgg-15","uid":"merged-mvkdcpgg-15","sourceNo":454,"originalSourceNo":454,"manualOrder":94,"workspaceFixedOrder":94,"lockedOrder":94,"orderLocked":true,"start":1514.926561,"end":1589.309448,"viRange":{"start":1514.926561,"end":1555.889578},"koRange":{"start":1548.593095,"end":1589.309448},"viRanges":[{"start":1514.926561,"end":1555.889578}],"koRanges":[{"start":1548.593095,"end":1589.309448}],"speakerSegments":[{"index":0,"start":1548.593,"end":1551.989,"text":"씁, 한창 일하고 계실 텐데. 위험한데","speed":1,"cueUid":"merged-mvkdcpgg-15","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":1,"start":1560.31,"end":1565.038,"text":"CD 됐거든요. 네? 나. 아…","speed":1,"cueUid":"merged-mvkdcpgg-15","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":2,"start":1565.038,"end":1569.05,"text":"아, 축하드려요. 뭘 저까지 챙겨 주시고","speed":1,"cueUid":"merged-mvkdcpgg-15","speakerIds":["AGENCY-008"],"speakerNames":["정수정"],"speakerLabel":"정수정:  "},{"index":3,"start":1569.05,"end":1571.858,"text":"아유, 상무님 비서면 다 같이 우리 팀이죠","speed":1,"cueUid":"merged-mvkdcpgg-15","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":4,"start":1571.858,"end":1589.309,"text":"계시죠? 네. 계약직인 나도. 다 같이 우리 팀…","speed":1,"cueUid":"merged-mvkdcpgg-15","speakerIds":["AGENCY-008"],"speakerNames":["정수정"],"speakerLabel":"정수정:  "}]},{"id":94,"readerNo":95,"displayNo":95,"n":95,"cueNo":95,"uniqueCueNo":95,"finalCueNo":95,"originalDisplayNo":95,"type":"narration","vi":"[Âm nhạc êm dịu]","ko":"[잔잔한 음악]","en":"[Calm music]","text":"[Âm nhạc êm dịu]\\n[잔잔한 음악]\\n[Calm music]","sourceUid":"ko-mvcgclth-1410","uid":"ko-mvcgclth-1410","sourceNo":452,"originalSourceNo":452,"manualOrder":95,"workspaceFixedOrder":95,"lockedOrder":95,"orderLocked":true,"start":1603.05,"end":1605.06,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":95,"readerNo":96,"displayNo":96,"n":96,"cueNo":96,"uniqueCueNo":96,"finalCueNo":96,"originalDisplayNo":96,"type":"dialogue","vi":"Cô là tổng giám đốc à? Dạ? Chị đang đợi ngài ấy sao?\nKhông. Vậy sao ạ? Vào phòng giám đốc mà không gõ cửa thì cũng phải cỡ tổng giám đốc.\nTôi là Quản lý Cho Eun Jeong.\nChị ăn bánh đi ạ. Tôi không ăn. Vậy chị để đến tối rồi ăn nhé.\nMai chị sẽ họp với Tập đoàn Woowon mà.\nTức là hôm nay chị sẽ thức thâu đêm để nghiên cứu.\nVậy thì chị sẽ cần đồ ngọt đấy.\nThay vì đồ ngọt… Vâng, Giám đốc Go. Tôi cần thời gian ở một mình hơn.\nKhông được ạ. Cái gì cũng phải cùng nhau chứ. Chúng ta là một đội mà.\nBị bỏ lại một mình thì sẽ cô đơn lắm.\n\"Chúng ta\"? Được thăng chức nên cô vui quá nhỉ?\nDĩ nhiên rồi ạ. Có chuyện mừng thì vui, có chuyện không vui thì buồn. Ai mà chẳng sống như vậy ạ.","ko":"고아인, 조은정: 대표님이세요? 네? 아, 대표님 오시기로 하셨어요? 아니\n고아인: 근데요? 상무 방에 노크도 없이 들어오려면 대표쯤 돼야 되는 거 아닌가?\n조은정, 고아인: 아! 조은정 CD입니다. 케이크 좀 드세요. 안 먹어\n조은정: 그럼 이따가 새벽에 드세요\n조은정: 아니, 내일 우원그룹 들어가신다면서요\n조은정: 그럼 오늘도 날 새고 자료 보실 거고\n조은정: 그럼 요 단게 필요하지 않으시겠어요?\n고아인, 조은정: 나는 단거보단. 네, 상무님. 혼자 있을 시간이 필요한데\n고아인: 싫은데요? 아, 같이 해야죠. 아, 우리는 팀인데\n조은정, 고아인: 그리고 혼자 하면 외롭잖아요. 우리? CD 됐다고 많이 업됐네\n조은정: 그럼요, 좋은 일 있으면 업 하고 나쁜 일 있으면 다운 하고\n조은정: 뭐, 사람 사는 게 다 그런 거죠","en":"Are you the CEO? Sorry? Were you waiting for him?\nNo. Then why? To walk into my office without knocking,\nyou should at least be the CEO.\nThis is Creative Director Cho.\nHave some cake. No thanks. Then eat it later at night.\nI heard you're competing for the Woowon Group ad tomorrow.\nThat means you'll read materials all night today.\nYou'll need something sweet.\nRather than sweet things…\nYes, Ms. Go. I need time alone. We should all do this together.\nWe're a team. And you'll be lonely doing it alone.\n\"We\"? You look pretty happy about the promotion.\nOf course. I'm happy when there's good news. I'm sad when there's bad news. That's the way it is for everyone.","text":"Cô là tổng giám đốc à? Dạ? Chị đang đợi ngài ấy sao?\nKhông. Vậy sao ạ? Vào phòng giám đốc mà không gõ cửa thì cũng phải cỡ tổng giám đốc.\nTôi là Quản lý Cho Eun Jeong.\nChị ăn bánh đi ạ. Tôi không ăn. Vậy chị để đến tối rồi ăn nhé.\nMai chị sẽ họp với Tập đoàn Woowon mà.\nTức là hôm nay chị sẽ thức thâu đêm để nghiên cứu.\nVậy thì chị sẽ cần đồ ngọt đấy.\nThay vì đồ ngọt… Vâng, Giám đốc Go. Tôi cần thời gian ở một mình hơn.\nKhông được ạ. Cái gì cũng phải cùng nhau chứ. Chúng ta là một đội mà.\nBị bỏ lại một mình thì sẽ cô đơn lắm.\n\"Chúng ta\"? Được thăng chức nên cô vui quá nhỉ?\nDĩ nhiên rồi ạ. Có chuyện mừng thì vui, có chuyện không vui thì buồn. Ai mà chẳng sống như vậy ạ.\\n고아인, 조은정:  대표님이세요? 네? 아, 대표님 오시기로 하셨어요? 아니\n고아인:  근데요? 상무 방에 노크도 없이 들어오려면 대표쯤 돼야 되는 거 아닌가?\n조은정, 고아인:  아! 조은정 CD입니다. 케이크 좀 드세요. 안 먹어\n조은정:  그럼 이따가 새벽에 드세요\n조은정:  아니, 내일 우원그룹 들어가신다면서요\n조은정:  그럼 오늘도 날 새고 자료 보실 거고\n조은정:  그럼 요 단게 필요하지 않으시겠어요?\n고아인, 조은정:  나는 단거보단. 네, 상무님. 혼자 있을 시간이 필요한데\n고아인:  싫은데요? 아, 같이 해야죠. 아, 우리는 팀인데\n조은정, 고아인:  그리고 혼자 하면 외롭잖아요. 우리? CD 됐다고 많이 업됐네\n조은정:  그럼요, 좋은 일 있으면 업 하고 나쁜 일 있으면 다운 하고\n조은정:  뭐, 사람 사는 게 다 그런 거죠\\nAre you the CEO? Sorry? Were you waiting for him?\nNo. Then why? To walk into my office without knocking,\nyou should at least be the CEO.\nThis is Creative Director Cho.\nHave some cake. No thanks. Then eat it later at night.\nI heard you're competing for the Woowon Group ad tomorrow.\nThat means you'll read materials all night today.\nYou'll need something sweet.\nRather than sweet things…\nYes, Ms. Go. I need time alone. We should all do this together.\nWe're a team. And you'll be lonely doing it alone.\n\"We\"? You look pretty happy about the promotion.\nOf course. I'm happy when there's good news. I'm sad when there's bad news. That's the way it is for everyone.","sourceUid":"merged-mvkei5vl-17","uid":"merged-mvkei5vl-17","sourceNo":482,"originalSourceNo":482,"manualOrder":96,"workspaceFixedOrder":96,"lockedOrder":96,"orderLocked":true,"start":1561.270475,"end":1673.550949,"viRange":{"start":1561.270475,"end":1639.497796},"koRange":{"start":1595.236171,"end":1673.550949},"viRanges":[{"start":1561.270475,"end":1639.497796}],"koRanges":[{"start":1595.236171,"end":1673.550949}],"speakerSegments":[{"index":0,"start":1595.236,"end":1603.291,"text":"대표님이세요? 네? 아, 대표님 오시기로 하셨어요? 아니","speed":1,"cueUid":"merged-mvkei5vl-17","speakerIds":["AGENCY-001","AGENCY-005"],"speakerNames":["고아인","조은정"],"speakerLabel":"고아인, 조은정:  "},{"index":1,"start":1603.291,"end":1609.981,"text":"근데요? 상무 방에 노크도 없이 들어오려면 대표쯤 돼야 되는 거 아닌가?","speed":1,"cueUid":"merged-mvkei5vl-17","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":1609.981,"end":1621.631,"text":"아! 조은정 CD입니다. 케이크 좀 드세요. 안 먹어","speed":1,"cueUid":"merged-mvkei5vl-17","speakerIds":["AGENCY-005","AGENCY-001"],"speakerNames":["조은정","고아인"],"speakerLabel":"조은정, 고아인:  "},{"index":3,"start":1621.631,"end":1624.461,"text":"그럼 이따가 새벽에 드세요","speed":1,"cueUid":"merged-mvkei5vl-17","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":4,"start true,"start":1676,"end":1677.09,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[{"index":0,"start":0.15,"end":null,"text":"[잔잔한 음악]","speed":1,"cueUid":"ko-mvcgclth-1434","speakerIds":[],"speakerNames":[],"speakerLabel":""}]},{"id":97,"readerNo":98,"displayNo":98,"n":98,"cueNo":98,"uniqueCueNo":98,"finalCueNo":98,"originalDisplayNo":98,"type":"dialogue","vi":"Sống vậy không mệt à? Mệt gì ạ?\nCười rồi lại khóc. Vui rồi lại buồn. Tốn năng lượng lắm. Mệt chứ ạ.\nNhưng không lẽ chỉ vì sợ mệt mỏi, sợ hao phí cảm xúc, mà phải sống dửng dưng sao?\nCon người chứ có phải rô-bốt đâu.\nVậy nên ta mới cần những thứ ngọt ngào như vậy cho cuộc sống.","ko":"고아인: 그렇게 살면 안 지치니? 뭐가요?\n고아인: 웃었다가 울었다가 기뻤다가 슬펐다가\n고아인: 에너지 낭비 심할 텐데. 지치죠\n조은정: 근데 그럼 뭐, 지칠까 봐\n조은정: 감정 소비하기 싫어서 무덤덤하게 살아요?\n조은정: 에이, 사람이 로보트도 아니고\n조은정: 그래서 인생에는 요런 달달한 게 필요한 거죠","en":"Isn't that exhausting? What do you mean?\nYou laugh then cry. You're happy then sad.\nThat's energy-consuming. It's exhausting.\nBut people don't bottle up their feelings\njust because they're afraid of getting exhausted.\nHumans aren't robots.\nThat's why in life, we need sweet things like this.","text":"Sống vậy không mệt à? Mệt gì ạ?\nCười rồi lại khóc. Vui rồi lại buồn. Tốn năng lượng lắm. Mệt chứ ạ.\nNhưng không lẽ chỉ vì sợ mệt mỏi, sợ hao phí cảm xúc, mà phải sống dửng dưng sao?\nCon người chứ có phải rô-bốt đâu.\nVậy nên ta mới cần những thứ ngọt ngào như vậy cho cuộc sống.\\n고아인:  그렇게 살면 안 지치니? 뭐가요?\n고아인:  웃었다가 울었다가 기뻤다가 슬펐다가\n고아인:  에너지 낭비 심할 텐데. 지치죠\n조은정:  근데 그럼 뭐, 지칠까 봐\n조은정:  감정 소비하기 싫어서 무덤덤하게 살아요?\n조은정:  에이, 사람이 로보트도 아니고\n조은정:  그래서 인생에는 요런 달달한 게 필요한 거죠\\nIsn't that exhausting? What do you mean?\nYou laugh then cry. You're happy then sad.\nThat's energy-consuming. It's exhausting.\nBut people don't bottle up their feelings\njust because they're afraid of getting exhausted.\nHumans aren't robots.\nThat's why in life, we need sweet things like this.","sourceUid":"merged-mvkewopv-20","uid":"merged-mvkewopv-20 abel":"고아인:  "}]},{"id":106,"readerNo":107,"displayNo":107,"n":107,"cueNo":107,"uniqueCueNo":107,"finalCueNo":107,"originalDisplayNo":107,"type":"narration","vi":"TRUYỀN THÔNG VC","ko":"","en":"","text":"TRUYỀN THÔNG VC","sourceUid":"vi-mvcgcgla-483","uid":"vi-mvcgcgla-483","sourceNo":483,"originalSourceNo":483,"manualOrder":107,"workspaceFixedOrder":107,"lockedOrder":107,"orderLocked":true,"start":1854.22,"end":1859.44,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":107,"readerNo":108,"displayNo":108,"n":108,"cueNo":108,"uniqueCueNo":108,"finalCueNo":108,"originalDisplayNo":108,"type":"narration","vi":"[thở dài]\n[nhạc nặng]","ko":"[한숨]\n[무거운 음악]","en":"[sigh]\n[heavy music]","text":"[thở dài]\n[nhạc nặng]\\n[한숨]\n[무거운 음악]\\n[sigh]\n[heavy music]","sourceUid":"merged-mvkfw1ix-42","uid":"merged-mvkfw1ix-42","sourceNo":527,"originalSourceNo":527,"manualOrder":108,"workspaceFixedOrder":108,"lockedOrder":108,"orderLocked":true,"start":1868.9,"end":1871.16,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":108,"readerNo":109,"displayNo":109,"n":109,"cueNo":109,"uniqueCueNo":109,"finalCueNo":109,"originalDisplayNo":109,"type":"dialogue","vi":"Không biết con bé tan làm chưa nhỉ?\nMình chỉ muốn… được thấy mặt con bé dù chỉ một lần.\nTạm biệt mọi người.\nQuản lý sáng tạo Cho. Cô định về thật sao?\nChị vừa lên chức hôm nay mà.\nHai người tưởng tôi muốn về lắm sao?\nChúng ta vẫn còn quỹ đội mà.\nThôi đừng cố cám dỗ tôi nữa, hai người về đi.\nĐi giùm tôi đi. Mai gặp lại. Tạm biệt. Chị đi nhé.\nCô ơi, cho tôi hỏi. Tôi có thể hỏi cô một việc được không?\nVâng. Cô muốn hỏi gì vậy ạ? Cô làm ở đây phải không?\nVâng, đúng vậy. Ra vậy.","ko":"서은자: 퇴근했으려나. \"VC기획\"\n서은자: 그냥. 딱 한 번 얼굴만이라도 어떻게\n서장우: 가세요. 은정 CD! 진짜 가게? CD 된 날인데 그냥 가요?\n조은정: 치, 난 뭐 집에 가고 싶은 줄 알아요?\n서장우: 우리 남은 팀비가…\n조은정: 워이, 잡귀야, 물러가라 물러가라, 물러가\n서장우: 가세요. 내일 봐. 들어가세요.\n서은자, 조은정: 실례합니다. 저기, 제가 뭐 좀 물어봐도 될까요? 아, 네, 무슨…\n서은자, 조은정: 이 회사 다니시죠? 네, 그런데요?","en":"I wonder if she got off work.\nI wish… I can see her face just once.\nGood night. Creative Director Cho. You're really going?\nToday's your promotion day.\nDo you think I want to go home?\nWe have money left on our team's account.\nStop your magic, you tempting spirits. Go now. See you tomorrow. Goodbye. Bye. \nExcuse me. I was wondering if I could ask you a question. Sure. What is it? Do you work here?\nYes, I do. I see.","text":"Không biết con bé tan làm chưa nhỉ?\nMình chỉ muốn… được thấy mặt con bé dù chỉ một lần.\nTạm biệt mọi người.\nQuản lý sáng tạo Cho. Cô định về thật sao?\nChị vừa lên chức hôm nay mà.\nHai người tưởng tôi muốn về lắm sao?\nChúng ta vẫn còn quỹ đội mà.\nThôi đừng cố cám dỗ tôi nữa, hai người về đi.\nĐi giùm tôi đi. Mai gặp lại. Tạm biệt. Chị đi nhé.\nCô ơi, cho tôi hỏi. Tôi có thể hỏi cô một việc được không?\nVâng. Cô muốn hỏi gì vậy ạ? Cô làm ở đây phải không?\nVâng, đúng vậy. Ra vậy.\\n서은자:  퇴근했으려나. \"VC기획\"\n서은자:  그냥. 딱 한 번 얼굴만이라도 어떻게\n서장우:  가세요. 은정 CD! 진짜 가게? CD 된 날인데 그냥 가요?\n조은정:  치, 난 뭐 집에 가고 싶은 줄 알아요?\n서장우:  우리 남은 팀비가…\n조은정:  워이, 잡귀야, 물러가라 물러가라, 물러가\n서장우:  가세요. 내일 봐. 들어가세요.\n서은자, 조은정:  실례합니다. 저기, 제가 뭐 좀 물어봐도 될까요? 아, 네, 무슨…\n서은자, 조은정:  이 회사 다니시죠? 네, 그런데요?\\nI wonder if she got off work.\nI wish… I can see her face just once.\nGood night. Creative Director Cho. You're really going?\nToday's your promotion day.\nDo you think I want to go home?\nWe have money left on our team's account.\nStop your magic, you tempting spirits. Go now. See you tomorrow. Goodbye. Bye. \nExcuse me. I was wondering if I could ask you a question. Sure. What is it? Do you work here?\nYes, I do. I see.","sourceUid":"merged-mvkg2toa-50","uid":"merged-mvkg2toa-50","sourceNo":546,"originalSourceNo":546,"manualOrder":109,"workspaceFixedOrder":109,"lockedOrder":109,"orderLocked":true,"start":1813.700723,"end":1909.242689,"viRange":{"start":1813.700723,"end":1875.369096},"koRange":{"start":1849.577411,"end":1909.242689},"viRanges":[{"start":1813.700723,"end":1875.3 ong ngáp]","ko":"[은정의 하품]","en":"[Eunjeong’s yawn]","text":"[Eunjeong ngáp]\\n[은정의 하품]\\n[Eunjeong’s yawn]","sourceUid":"ko-mvcgclth-1490","uid":"ko-mvcgclth-1490","sourceNo":532,"originalSourceNo":532,"manualOrder":110,"workspaceFixedOrder":110,"lockedOrder":110,"orderLocked":true,"start":1890.34,"end":1891.51,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":110,"readerNo":111,"displayNo":111,"n":111,"cueNo":111,"uniqueCueNo":111,"finalCueNo":111,"originalDisplayNo":111,"type":"dialogue","vi":"Bình thường nhân viên ở đây tan làm lúc mấy giờ? Ở đây… không có giờ tan làm. Sao?\nNhân viên của công ty quảng cáo làm việc bất kể giờ giấc và ngày nghỉ.\nNhưng sao cô lại hỏi vậy? Không có gì. Tại lúc nào tôi cũng thấy đèn sáng.\nVậy không biết, những người chức cao cũng làm việc muộn sao?\nÝ tôi là các vị giám đốc ấy.\nCũng tùy người thôi ạ.","ko":"서은자: 어, 여기는 퇴근 시간이 어떻게 되나요?\n조은정: 아… 여기는, 음. 저, 퇴근 시간이 따로 없어요\n조은정: 예? 아, 대행사는 퇴근도 주말도 따로 없거든요\n조은정, 서은자: 근데 왜 그러세요? 아, 아니요, 저\n서은자: 항상 불이 켜져 있길래\n서은자: 아. 저기, 그럼 혹시 높으신 분들도 그러세요?\n서은자, 조은정: 상무 같은 분들도. 어… 어, 케바케긴 한데요","en":"When do people get off work?\nWell, for this place… there's no such thing. Sao? Sorry?\nPeople working at agencies don't clock out or rest on weekends.\nWhy do you ask? It's nothing. I noticed that the lights are always on.\nThen by any chance, do the higher-ups also work until late?\nLike managing directors. Well, that depends.","text":"Bình thường nhân viên ở đây tan làm lúc mấy giờ? Ở đây… không có giờ tan làm. Sao?\nNhân viên của công ty quảng cáo làm việc bất kể giờ giấc và ngày nghỉ.\nNhưng sao cô lại hỏi vậy? Không có gì. Tại lúc nào tôi cũng thấy đèn sáng.\nVậy không biết, những người chức cao cũng làm việc muộn sao?\nÝ tôi là các vị giám đốc ấy.\nCũng tùy người thôi ạ.\\n서은자:  어, 여기는 퇴근 시간이 어떻게 되나요?\n조은정:  아… 여기는, 음. 저, 퇴근 시간이 따로 없어요\n조은정:  예? 아, 대행사는 퇴근도 주말도 따로 없거든요\n조은정, 서은자:  근데 왜 그러세요? 아, 아니요, 저\n서은자:  항상 불이 켜져 있길래\n서은자:  아. 저기, 그럼 혹시 높으신 분들도 그러세요?\n서은자, 조은정:  상무 같은 분들도. 어… 어, 케바케긴 한데요\\nWhen do people get off work?\nWell, for this place… there's no such thing. Sao? Sorry?\nPeople working at agencies don't clock out or rest on weekends.\nWhy do you ask? It's nothing. I noticed that the lights are always on.\nThen by any chance, do the higher-ups also work until late?\nLike managing directors. Well, that depends.","sourceUid":"merged-mvkgs7da-55","uid":"merged-mvkgs7da-55","sourceNo":560,"originalSourceNo":560,"manualOrder":111,"workspaceFixedOrder":111,"lockedOrder":111,"orderLocked":true,"start":1875.369096,"end":1943.395851,"viRange":{"start":1875.369096,"end":1909.839118},"koRange":{"start":1909.242689,"end":1943.395851},"viRanges":[{"start":1875.369096,"end":1909.839118}],"koRanges":[{"start":1909.242689,"end":1943.395851}],"speakerSegments":[{"index":0,"start":1909.243,"end":1913.184,"text":"어, 여기는 퇴근 시간이 어떻게 되나요?","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "},{"index":1,"start":1913.184,"end":1919.665,"text":"아… 여기는, 음. 저, 퇴근 시간이 따로 없어요","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":2,"start":1919.665,"end":1924.077,"text":"예? 아, 대행사는 퇴근도 주말도 따로 없거든요","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":3,"start":1924.077,"end":1928.369,"text":"근데 왜 그러세요? 아, 아니요, 저","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-005","AGENCY-025"],"speakerNames":["조은정","서은자"],"speakerLabel":"조은정, 서은자:  "},{"index":4,"start":1928.369,"end":1930.46,"text":"항상 불이 켜져 있길래","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "},{"index":5,"start":1930.46,"end":1937.487,"text":"아. 저기, 그럼 혹시 높으신 분들도 그러세요?","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "},{"index":6,"start":1937.487,"end":1943.396,"text":"상무 같은 분들도. 어… 어, 케바케긴 한데요","speed":1,"cueUid":"merged-mvkgs7da-55","speakerIds":["AGENCY-025","AGENCY-005"],"speakerNames":["서은자","조은정"],"speakerLabel":"서은자, 조은정:  "}]},{"id":111,"readerNo":112,"displayNo":112,"n":112,"cueNo":112,"uniqueCueNo":112,"finalCueNo":112,"originalDisplayNo":112,"type":"narration","vi":"","ko":"[은정이 웃으며]","en":"","text":"[은정이 웃으며]","sourceUid":"ko-mvcgclth-1514","uid":"ko-mvcgclth-1514","sourceNo":556,"originalSourceNo":556,"manualOrder":112,"workspaceFixedOrder":112,"lockedOrder":112,"orderLocked":true,"start":1953.32,"end":1954.99,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":112,"readerNo":113,"displayNo":113,"n":113,"cueNo":113,"uniqueCueNo":113,"finalCueNo":113,"originalDisplayNo":113,"type":"dialogue","vi":"Chỉ trừ duy nhất một người, các nhân sự cấp cao thường về sớm ạ.\nNgười duy nhất ở lại muộn đó là… Giám đốc Go A In sao?\nSao cô biết chị ấy vậy ạ?\nÀ thì, tôi từng thấy cô ấy trên TV.\nVậy thôi, cảm ơn cô nhé. Vâng ạ.","ko":"조은정: 아, 딱 한 분 제외하고는 높은 분들은 다들 칼퇴하세요\n서은자: 딱 한 분이라면 혹시 고아인 상무님?\n조은정: 어? 우리 상무님을 어떻게 아세요?\n서은자: 아, 저기… TV에서 봤어요\n서은자: 아, 저기, 그러면 수고하세요. 네","en":"Except for one executive, all the higher-ups get off work on time.\nWho would that one executive be?\nManaging Director Go A-in? How do you know her?\nWell, I saw her on TV. Anyway, thank you. No problem.","text":"Chỉ trừ duy nhất một người, các nhân sự cấp cao thường về sớm ạ.\nNgười duy nhất ở lại muộn đó là… Giám đốc Go A In sao?\nSao cô biết chị ấy vậy ạ?\nÀ thì, tôi từng thấy cô ấy trên TV.\nVậy thôi, cảm ơn cô nhé. Vâng ạ.\\n조은정:  아, 딱 한 분 제외하고는 높은 분들은 다들 칼퇴하세요\n서은자:  딱 한 분이라면 혹시 고아인 상무님?\n조은정:  어? 우리 상무님을 어떻게 아세요?\n서은자:  아, 저기… TV에서 봤어요\n서은자:  아, 저기, 그러면 수고하세요. 네\\nExcept for one executive, all the higher-ups get off work on time.\nWho would that one executive be?\nManaging Director Go A-in? How do you know her?\nWell, I saw her on TV. Anyway, thank you. No problem.","sourceUid":"merged-mvkh24i3-59"," nges":[{"start":1975.671,"end":1994.265141}],"speakerSegments":[]},{"id":114,"readerNo":115,"displayNo":115,"n":115,"cueNo":115,"uniqueCueNo":115,"finalCueNo":115,"originalDisplayNo":115,"type":"dialogue","vi":"Con bé phải tự lo cho bản thân thay phần bố mẹ,\nnên mới nai lưng ra làm việc vậy đấy.\nTất cả là tại mình.\nMình là kẻ tội đồ.","ko":"서은자: 자식이 부모 역할까지 하면서 살려니\n비서: 뼈가 빠지게 일을 하는 거겠지\n서은자: 내가 죄인이지\n서은자: 내가 죄인이야","en":"She has to look after herself without a parent,\nso she's working to the bone.\nIt's all my fault.\nAll mine.","text":"Con bé phải tự lo cho bản thân thay phần bố mẹ,\nnên mới nai lưng ra làm việc vậy đấy.\nTất cả là tại mình.\nMình là kẻ tội đồ.\\n서은자:  자식이 부모 역할까지 하면서 살려니\n비서:  뼈가 빠지게 일을 하는 거겠지\n서은자:  내가 죄인이지\n서은자:  내가 죄인이야\\nShe has to look after herself without a parent,\nso she's working to the bone.\nIt's all my fault.\nAll mine.","sourceUid":"merged-mvkhlcs3-62","uid":"merged-mvkhlcs3-62","sourceNo":520,"originalSourceNo":520,"manualOrder":115,"workspaceFixedOrder":115,"lockedOrder":115,"orderLocked":true,"start":1960.466262,"end":2012.531599,"viRange":{"start":1960.466262,"end":1979.711733},"koRange":{"start":1994.265,"end":2012.531599},"viRanges":[{"start":1960.466262,"end":1979.711733}],"koRanges":[{"start":1994.265,"end":2012.531599}],"speakerSegments":[{"index":0,"start":null,"end":null,"text":"자식이 부모 역할까지 하면서 살려니","speed":1,"cueUid":"merged-mvkhlcs3-62","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "},{"index":1,"start":null,"end":null,"text":"뼈가 빠지게 일을 하는 거겠지","speed":1,"cueUid":"merged-mvkhlcs3-62","speakerIds":["sp-mvj3hdd7-20"],"speakerNames":["비서"],"speakerLabel":"비서:  "},{"index":2,"start":2002.433,"end":2007.724,"text":"내가 죄인이지","speed":1,"cueUid":"merged-mvkhlcs3-62","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "},{"index":3,"start":2007.724,"end":2012.532,"text":"내가 죄인이야","speed":1,"cueUid":"merged-mvkhlcs3-62","speakerIds":["AGENCY-025"],"speakerNames":["서은자"],"speakerLabel":"서은자:  "}]},{"id":115,"readerNo":116,"displayNo":116,"n":116,"cueNo":116,"uniqueCueNo":116,"finalCueNo":116,"originalDisplayNo":116,"type":"narration","vi":"VĂN PHÒNG GIÁM ĐỐC SÁNG TẠO\nDẪN DẮT TÔI, THEO SAU TÔI, KHÔNG THÌ TRÁNH RA","ko":"","en":"LEAD ME, FOLLOW ME, OR GET OUT OF MY WAY","text":"VĂN PHÒNG GIÁM ĐỐC SÁNG TẠO\nDẪN DẮT TÔI, THEO SAU TÔI, KHÔNG THÌ TRÁNH RA\\nLEAD ME, FOLLOW ME, OR GET OUT OF MY WAY","sourceUid":"merged-mvkhlo7z-63","uid":"merged-mvkhlo7z-63","sourceNo":522,"originalSourceNo":522,"manualOrder":116,"workspaceFixedOrder":116,"lockedOrder":116,"orderLocked":true,"start":1979.711733,"end":2067.643708,"viRange":{"start":1979.711733,"end":2035.443496},"koRange":{"start":2012.531599,"end":2067.643708},"viRanges":[{"start":1979.711733,"end":2035.443496}],"koRanges":[{"start":2012.531599,"end":2067.643708}],"speakerSegments":[]},{"id":116,"readerNo":117,"displayNo":117,"n":117,"cueNo":117,"uniqueCueNo":117,"finalCueNo":117,"originalDisplayNo":117,"type":"dialogue","vi":"Bất cứ thông điệp nào Woowon muốn truyền tải vào lúc này\ncũng sẽ bị công chúng đả kích nặng nề.\nQuản lý Yoo. Chúng ta có thể che đậy bê bối của công ty bằng cách tạo ra một thông điệp tích cực mà?\nBằng cách nào?\nThì… Thanh xuân, tương lai, hy vọng.\nMấy từ ngữ giả tạo đó có thể tạo nên hình ảnh dễ chịu mà?\nNày, cô nghĩ con người đơn giản vậy sao?","ko":"고아인: 지금 시점엔 무슨 메시지를 전달해도\n고아인: 부정적으로 받아들일 텐데\n유정석: CD님 기업에서 발생한 부정적인 이슈 긍정적인 메시지 만들어서 덮을 수 있잖아요. 어떻게? \n고아인: 음, 뭐 '청년, 미래, 희망'\n고아인: 이렇게 적당히 새 날아가는 소리에 몽글몽글한 그림 좀 잡아 주면 되지 않아요?\n야, 너 사람들이 그렇게 단순한 줄 알아?","en":"Any messages Woowon delivers at this point would be badly received by the public.\nMr. Yoo. Can't you cover up a company's bad issues by making up a positive message?\nHow? Well… Youth, hope, future.\nCan't you make some hopeful images with some superficial words like these?\nHey, you think people are that simple?","text":"Bất cứ thông điệp nào Woowon muốn truyền tải vào lúc này\ncũng sẽ bị công chúng đả kích nặng nề.\nQuản lý Yoo. Chúng ta có thể che đậy bê bối của công ty bằng cách tạo ra một thông điệp tích cực mà?\nBằng cách nào?\nThì… Thanh xuân, tương lai, hy vọng.\nMấy từ ngữ giả tạo đó có thể tạo nên hình ảnh dễ chịu mà?\nNày, cô nghĩ con người đơn giản vậy sao?\\n고아인:  지금 시점엔 무슨 메시지를 전달해도\n고아인:  부정적으로 받아들일 텐데\n유정석:  CD님 기업에서 발생한 부정적인 이슈 긍정적인 메시지 만들어서 덮을 수 있잖아요. 어떻게? \n고아인:  음, 뭐 '청년, 미래, 희망'\n고아인:  이렇게 적당히 새 날아가는 소리에 몽글몽글한 그림 좀 잡아 주면 되지 않아요?\n야, 너 사람들이 그렇게 단순한 줄 알아?\\nAny messages Woowon delivers at this point would be badly received by the public.\nMr. Yoo. Can't you cover up a company's bad issues by making up a positive message?\nHow? Well… Youth, hope, future.\nCan't you make some hopeful images with some superficial words like these?\nHey, you think people are that simple?","sourceUid":"merged-mvkhuxba-71","uid":"merged-mvkhuxba-71","sourceNo":584,"originalSourceNo":584,"manualOrder":117,"workspaceFixedOrder":117,"lockedOrder":117,"orderLocked":true,"start":2035.443496,"end":2105.733485,"viRange":{"start":2035.443496,"end":2071.590437},"koRange":{"start":2067.643708,"end":2105.733485},"viRanges":[{"start":2035.443496,"end":2071.590437}],"koRanges":[{"start":2067.643708,"end":2105.733485}],"speakerSegments":[{"index":0,"start":2067.644,"end":2072.413,"text":"지금 시점엔 무슨 메시지를 전달해도","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":2072.413,"end":2074.694,"text":"부정적으로 받아들일 텐데","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":2081.831,"end":2091.173,"text":"CD님 기업에서 발생한 부정적인 이슈 긍정적인 메시지 만들어서 덮을 수 있잖아요. 어떻게?","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":3,"start":2091.173,"end":2096.951,"text":"음, 뭐 '청년, 미래, 희망'","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":4,"start":2096.951,"end":2101.641,"text":"이렇게 적당히 새 날아가는 소리에 몽글몽글한 그림 좀 잡아 주면 되지 않아요?","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":5,"start":2101.641,"end":2105.733,"text":"야, 너 사람들이 그렇게 단순한 줄 알아?","speed":1,"cueUid":"merged-mvkhuxba-71","speakerIds":[],"speakerNames":[],"speakerLabel":""}]},{"id":117,"readerNo":118,"displayNo":118,"n":118,"cueNo":118,"uniqueCueNo":118,"finalCueNo":118,"originalDisplayNo":118,"type":"dialogue","vi":"\"Số lượng áp đảo sẽ đánh bại tất cả.\" Anh cũng thừa nhận điều đó mà.\nNgười khác phải xếp hàng dài để được làm với khách hàng này.\nSao anh lại định từ chối? Chỉ với hợp đồng này, hoa hồng cả năm… Cô nói là \"che đậy\"? Đúng vậy.\nHãy xem vũng nước này là bê bối, còn tờ giấy này là số lượng quảng cáo.\nNói cách khác là chi phí. Đây là một tỷ won. Không đủ. Hai tỷ, ba tỷ. Vẫn không đủ.\nVậy tiếp tục đổ thêm bốn, năm tỷ.\nRồi 50 tỷ. Rồi 100 tỷ. Nào? Cô thấy sao? Thấm sạch hết nước rồi. Đúng vậy.","ko":"고아인: 물량 앞에 장사 없다\n고아인: 이건 CD님도 인정하시는 거잖아요\n고아인: 아니 남들은 못 해서 안달인 이 큰 광고주를 왜 안 하려고 하시는 거예요?\n고아인, 유정석: 이것만 하면 우리 연말 성과금이… 덮는다? 네\n유정석: 자, 이 물이 부정적 이슈고 이 티슈가 광고 물량\n유정석: 매체비라고 치자. 10억? 부족하네. 20억, 30억\n유정석: 여전히 부족하네? 자, 그럼 40억, 50억. 500억. 천억\n유정석, 고아인: 자, 어때? 물 다 치워졌잖아요. 그렇지","en":"\"Overwhelming quality beats everything.\" You know that too.\nEveryone will line up for this client.\nBut why are you refusing it?\nWith this, our incentives will--\n\"Covering up,\" you say? Yes.\nLet's say that this water is a bad issue and the tissue is our ad quantity.\nIn other words, ad expense. This is a billion won. Not enough.\nTwo, three billion. Still not enough. Then let's go for four or five billion.\nThen 50 billion. And 100 billion. So? How does it look? There's no more water. That's right.","text":"\"Số lượng áp đảo sẽ đánh bại tất cả.\" Anh cũng thừa nhận điều đó mà.\nNgười khác phải xếp hàng dài để được làm với khách hàng này.\nSao anh lại định từ chối? Chỉ với hợp đồng này, hoa hồng cả năm… Cô nói là \"che đậy\"? Đúng vậy.\nHãy xem vũng nước này là bê bối, còn tờ giấy này là số lượng quảng cáo.\nNói cách khác là chi phí. Đây là một tỷ won. Không đủ. Hai tỷ, ba tỷ. Vẫn không đủ.\nVậy tiếp tục đổ thêm bốn, năm tỷ.\nRồi 50 tỷ. Rồi 100 tỷ. Nào? Cô thấy sao? Thấm sạch hết nước rồi. Đúng vậy.\\n고아인:  물량 앞에 장사 없다\n고아인:  이건 CD님도 인정하시는 거잖아요\n고아인:  아니 남들은 못 해서 안달인 이 큰 광고주를 왜 안 하려고 하시는 거예요?\n고아인, 유정석:  이것만 하면 우리 연말 성과금이… 덮는다? 네\n유정석:  자, 이 물이 부정적 이슈고 이 티슈가 광고 물량\n유정석:  매체비라고 치자. 10억? 부족하네. 20억, 30억\n유정석:  여전히 부족하네? 자, 그럼 40억, 50억. 500억. 천억\n유정석, 고아인:  자, 어때? 물 다 치워졌잖아요. 그렇지\\n\"Overwhelming quality beats everything.\" You know that too.\nEveryone will line up for this client.\nBut why are you refusing it?\nWith this, our incentives will--\n\"Covering up,\" you say? Yes.\nLet's say that this water is a bad issue and the tissue is our ad quantity.\nIn other words, ad expense. This is a billion won. Not enough.\nTwo, three billion. Still not enough. Then let's go for four or five billion.\nThen 50 billion. And 100 billion. So? How does it look? There's no more water. That's right.","sourceUid":"merged-mvkiebbj-81","uid":"merged-mvkiebbj-81","sourceNo":550,"originalSourceNo":550,"manualOrder":118,"workspaceFixedOrder":118,"lockedOrder":118,"orderLocked":true,"start":2071.590437,"end":2167.178281,"viRange":{"start":2071.590437,"end":2133.023449},"koRange":{"start":2105.733485,"end":2167.178281},"viRanges":[{"start":2071.590437,"end":2133.023449}],"koRanges":[{"start":2105.733485,"end":2167.178281}],"speakerSegments":[{"index":0,"start":2105.733,"end":2108.079,"text":"물량 앞에 장사 없다","speed":1,"cueUid":"merged-mvkiebbj-81","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":2108.079,"end":2110.077,"text":"이건 CD님도 인정하시는 거잖아요","speed":1,"cueUid":"merged-mvkiebbj-81","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":2110.077,"end":2115.451,"text":"아니 e message\nlike this, and you present it.\nSo… you wait for the issue to go away, and plant a positive image with less expense.","sourceUid":"merged-mvkisqby-88","uid":"merged-mvkisqby-88","sourceNo":618,"originalSourceNo":618,"manualOrder":120,"workspaceFixedOrder":120,"lockedOrder":120,"orderLocked":true,"start":2133.023449,"end":2208.692991,"viRange":{"start":2133.023449,"end":2174.900903},"koRange":{"start":2167.178281,"end":2208.692991},"viRanges":[{"start":2133.023449,"end":2174.900903}],"koRanges":[{"start":2167.178281,"end":2208.692991}],"speakerSegments":[{"index":0,"start":2167.178,"end":2170.769,"text":"아, 그러니까 물량으로 덮을 수 있다는 거잖아요","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":2170.769,"end":2178.6,"text":"맞아. 근데 여기서 중요한 사실 어차피 이 물은 내일이면 다 사라져","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":2,"start":2178.6,"end":2180.643,"text":"저절로 말라서 없어진다고","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":3,"start":2180.643,"end":2199.234,"text":"그럼 그때. 자, 이렇게. 예쁜 메시지 하나 만들어서 탁 보여 주면?","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":4,"start":2199.234,"end":2204.873,"text":"그러니까 부정적인 이슈가 사라지길 기다렸다가","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":5,"start":2204.873,"end":2208.693,"text":"적은 돈으로 긍정적인 이미지를 심어 주면 된다?","speed":1,"cueUid":"merged-mvkisqby-88","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "}]},{"id":120,"readerNo":121,"displayNo":121,"n":121,"cueNo":121,"uniqueCueNo":121,"finalCueNo":121,"originalDisplayNo":121,"type":"narration","vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","text":"[Âm nhạc thú vị]\\n[흥미로운 음악]\\n[Intere lOrder":124,"workspaceFixedOrder":124,"lockedOrder":124,"orderLocked":true,"start":2317.06,"end":2318.23,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":124,"readerNo":125,"displayNo":125,"n":125,"cueNo":125,"uniqueCueNo":125,"finalCueNo":125,"originalDisplayNo":125,"type":"dialogue","vi":"Một khi đã nếm vị ngọt rồi, thì rất khó để cai.\nCũng đỡ hơn một chút.\n\"Đỡ hơn\" chỗ nào chứ?\n\"Quan điểm của thẩm phán mới được bổ nhiệm có phần đỡ hơn\"?","ko":"고아인: 단맛 한번 보면 끊기 어려운데\n고아인: 조금은 낫네\n김우원: 낫기는 뭐가 나아!\n비서: 배정된 판사 성향이 그나마 낫다?","en":"It's hard to quit sweets after you get a taste.\nI feel a bit better.\nWhat do you mean by \"better\"?\n\"The views of the newly-appointed judge are relatively better\"?","text":"Một khi đã nếm vị ngọt rồi, thì rất khó để cai.\nCũng đỡ hơn một chút.\n\"Đỡ hơn\" chỗ nào chứ?\n\"Quan điểm của thẩm phán mới được bổ nhiệm có phần đỡ hơn\"?\\n고아인:  단맛 한번 보면 끊기 어려운데\n고아인:  조금은 낫네\n김우원:  낫기는 뭐가 나아!\n비서:  배정된 판사 성향이 그나마 낫다?\\nIt's hard to quit sweets after you get a taste.\nI feel a bit better.\nWhat do you mean by \"better\"?\n\"The views of the newly-appointed judge are relatively better\"?","sourceUid":"merged-mvkjf3oh-102","uid":"merged-mvkjf3oh-102","sourceNo":643,"originalSourceNo":643,"manualOrder":125,"workspaceFixedOrder":125,"lockedOrder":125,"orderLocked":true,"start":2277.995827,"end":2337.057916,"viRange":{"start":2277.995827,"end":2302.646711},"koRange":{"start":2312.055657,"end":2337.057916},"viRanges":[{"start":2277.995827,"end":2302.646711}],"koRanges":[{"start":2312.055657,"end":2337.057916}],"speakerSegments":[{"index":0,"start":2312.056,"end":2315.124,"text":"단맛 한번 보면 끊기 어려운데","speed":1,"cueUid":"merged-mvkjf3oh-102","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":2315.124,"end":2318.676,"text":"조금은 낫네","speed":1,"cueUid":"merged-mvkjf3oh-102","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":2329  can do the first trial and then get you a presidential or Independence Day pardon.\nBut they don't work nowadays. Then…","text":"Vậy các anh bảo tôi cứ ngồi trong tù đến cuối phiên tòa sao?\nLần này có vẻ hơi khó, thưa Chủ tịch.\nSao? Ngày trước, vượt qua phiên sơ thẩm là cách tốt nhất để…\nNày, Luật sư. Vâng. Đừng vòng vo tam quốc nữa.\nVào thẳng vấn đề đi. Vâng. \nTa kết thúc sơ thẩm và đưa ông ra ngoài nhờ đợt đặc xá của Tổng thống hoặc Quốc khánh.\nNhưng dạo này không làm được vậy. Vậy…\\n김우원:  그럼 나더러 계속 여기 있으면서 재판받으라는 거야?\n비서실장:  이번엔 어려울 것 같습니다 회장님\n법무팀장:  왜? 예전 같으면 차라리 1심을 빨리 끝내는 게 좋은데\n김우원:  어이, 법조인. 예. 자락 깔지 말고 본론만 말해\n법무팀장:  예, 1심 빨리 끝내고 대통령 특별 사면이나 광복절 특사 같은 걸로 나올 수가 있는데 요즘 또 그런 분위기가…\\nAre you telling me to stay behind bars during this whole trial?\nThis is going to be difficult, sir.\nWhat? In the past, getting over the first trial would've been the best--\nHey, Lawyer. Yes, sir. Don't beat around the bush.\nGet to the point. Yes. We can do the first trial and then get you a presidential or Independence Day pardon.\nBut they don't work nowadays. Then…","sourceUid":"merged-mvkper9a-6","uid":"merged-mvkper9a-6","sourceNo":651,"originalSourceNo":651,"manualOrder":127,"workspaceFixedOrder":127,"lockedOrder":127,"orderLocked":true,"start":2302.646711,"end":2364.139007,"viRange":{"start":2302.646711,"end":2330.601867},"koRange":{"start":2337.057916,"end":2364.139007},"viRanges":[{"start":2302.646711,"end":2330.601867}],"koRanges":[{"start":2337.057916,"end":2364.139007}],"speakerSegments":[{"index":0,"start":2337.058,"end":2342.712,"text":"그럼 나더러 계속 여기 있으면서 재판받으라는 거야?","speed":1,"cueUid":"merged-mvkper9a-6","speakerIds":["AGENCY-020"],"speakerNames":["김우원"],"speakerLabel":"김우원:  "},{"index":1,"start":2342.712,"end":2347.083,"text":"이번엔 어려울 것 같습니다 회장님","speed":1,"cueUid":"merged-mvkper9a-6","speakerIds":["sp-mvkpp9vi-7"],"speakerNames":["비서실장"],"speakerLabel":"비서실장:  "},{"index":2,"start":2347.083,"end":2351.502,"text":"왜? 예전 같으면 차라리 1심을 빨리 끝내는 게 좋은데","speed":1,"cueUid":"merged-mvkper9a-6","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "},{"index":3,"start":2351.502,"end":2356.962,"text":"어이, 법조인. 예. 자락 깔지 말고 본론만 말해","speed":1,"cueUid":"merged-mvkper9a-6","speakerIds":["AGENCY-020"],"speakerNames":["김우원"],"speakerLabel":"김우원:  "},{"index":4,"start":2356.962,"end":2364,"text":"예, 1심 빨리 끝내고 대통령 특별 사면이나, 광복절 특사 같은 걸로 나올 수가 있는데, 요즘 또 그런 분위기가…","speed":1,"cueUid":"merged-mvkper9a-6","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "}]},{"id":127,"readerNo":128,"displayNo":128,"n":128,"cueNo":128,"uniqueCueNo":128,"finalCueNo":128,"originalDisplayNo":128,"type":"dialogue","vi":"Tại ngoại để trị bệnh?\nChuyện đó cũng không dễ đâu, Chủ tịch.\nKhoảnh khắc ông ngồi xe lăn và xuất hiện trước báo chí,\ncư dân mạng sẽ chế giễu ông. Vậy là…\nanh đang kêu tôi ngồi tù mọt gông đi sao?\nChủ tịch. Tôi đổ cả đống tiền cho công ty anh.\nGiờ chính là lúc các anh phát huy giá trị của số tiền đó!\nNhưng công tố viên đảm nhận vụ này khá…\nTôi cũng biết hắn rất điên khùng!","ko":"김우원: 그럼 병보석으로는?\n황석우: 그것도 쉽지가 않습니다, 회장님\n황석우: 휠체어 타고 언론에 등장하시는 순간 네티즌들의 조롱이… 그럼\n김우원: 지금 나보고 쌩으로 징역 다 살라는 거야?\n김우원: 회장님. 내가 그 많은 돈을 왜 로펌에 해마다 갖다줬겠어!\n김우원: 이런 상황에 맞춰서 보험 든 거 아니야!\n김우원: 근데 담당 검사가 워낙…\n김우원: 개또라이라는 건 나도 알아!","en":"What about medical bail?\nThat's not going to be easy either, sir.\nThe moment you are in a wheelchair in front of the press,\nthe online public will mock you. Then…\nare you telling me to serve a full sentence?\nSir. Why did I pay your law firm so much?\nI expect my money's worth in a situation like this!\nBut the prosecutor in charge is--\nI know he's a nutjob!","text":"Tại ngoại để trị bệnh?\nChuyện đó cũng không dễ đâu, Chủ tịch.\nKhoảnh khắc ông ngồi xe lăn và xuất hiện trước báo chí,\ncư dân mạng sẽ chế giễu ông. Vậy là…\nanh đang kêu tôi ngồi tù mọt gông đi sao?\nChủ tịch. Tôi đổ cả đống tiền cho công ty anh.\nGiờ chính là lúc các anh phát huy giá trị của số tiền đó!\nNhưng công tố viên đảm nhận vụ này khá…\nTôi cũng biết hắn rất điên khùng!\\n김우원:  그럼 병보석으로는?\n황석우:  그것도 쉽지가 않습니다, 회장님\n황석우:  휠체어 타고 언론에 등장하시는 순간 네티즌들의 조롱이… 그럼\n김우원:  지금 나보고 쌩으로 징역 다 살라는 거야?\n김우원:  회장님. 내가 그 많은 돈을 왜 로펌에 해마다 갖다줬겠어!\n김우원:  이런 상황에 맞춰서 보험 든 거 아니야!\n김우원:  근데 담당 검사가 워낙…\n김우원:  개또라이라는 건 나도 알아!\\nWhat about medical bail?\nThat's not going to be easy either, sir.\nThe moment you are in a wheelchair in front of the press,\nthe online public will mock you. Then…\nare you telling me to serve a full sentence?\nSir. Why did I pay your law firm so much?\nI expect my money's worth in a situation like this!\nBut the prosecutor in charge is--\nI know he's a nutjob!","sourceUid":"merged-mvkpyt08-13","uid":"merged-mvkpyt08-13","sourceNo":664,"originalSourceNo":664,"manualOrder":128,"workspaceFixedOrder":128,"lockedOrder":128,"orderLocked":true,"start":2330.601867,"end":2387.985872,"viRange":{"start":2330.601867,"end":2355.351437},"koRange":{"start":2364.139007,"end":2387.985872},"viRanges":[{"start":2330.601867,"end":2355.351437}],"koRanges":[{"start":2364.139007,"end":2387.985872}],"speakerSegments":[{"index":0,"start":2364.139,"end":2366.49,"text":"그럼 병보석으로는?","speed":1,"cueUid":"merged-mvkpyt08-13","speakerIds":["AGENCY-020"],"speakerNames":["김우원"],"speakerLabel":"김우원:  "},{"index":1,"start":2366.49,"end":2368.609,"text":"그것도 쉽지가 않습니다, 회장님","speed":1,"cueUid":"merged-mvkpyt08-13","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":2,"start":2368.609,"end":2373.398,"text":"휠체어 타고 언론에 등장하시는 순간 네티즌들의 조롱이… 그럼","speed":1,"cueUid":"merged-mvkpyt08-13","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":3,"start":2373.398,"end":2376.727,"text":"지금 나보고 쌩으로 징역 다 살라는 거야?","speed":1,"cueUid":"merged-mvkpyt08-13","speakerIds":["AGENCY-020"],"speakerNames":["김우원"],"speakerLabel":"김우원:  "},{"index":4,"start":2376.727,"end":2380.448,"text":"회장님. 내가 그 많은 돈을 왜 로펌에 해마다 갖다줬겠어!","speed":1,"cueUid":"merged-mvkpyt08-13","speakerIds": ,"uid":"merged-mvkq6acg-18","sourceNo":672,"originalSourceNo":672,"manualOrder":131,"workspaceFixedOrder":131,"lockedOrder":131,"orderLocked":true,"start":2446.81,"end":2447.73,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":131,"readerNo":132,"displayNo":132,"n":132,"cueNo":132,"uniqueCueNo":132,"finalCueNo":132,"originalDisplayNo":132,"type":"narration","vi":"","ko":"고객님이 전화를 받을 수 없어 음성…","en":"","text":"고객님이 전화를 받을 수 없어 음성…","sourceUid":"ko-mvcgclti-1629","uid":"ko-mvcgclti-1629","sourceNo":671,"originalSourceNo":671,"manualOrder":132,"workspaceFixedOrder":132,"lockedOrder":132,"orderLocked":true,"start":2388.229886,"end":2427.046815,"viRange":{"start":2388.229886,"end":2391.569803},"koRange":{"start":2407.654534,"end":2427.046815},"viRanges":[{"start":2388.229886,"end":2391.569803}],"koRanges":[{"start":2407.654534,"end":2427.046815}],"speakerSegments":[]},{"id":132,"readerNo":133,"displayNo":133,"n":133,"cueNo":133,"uniqueCueNo":133,"finalCueNo":133,"originalDisplayNo":133,"type":"dialogue","vi":"Cấp trên thì đâm chọc, cấp dưới thì không nghe lời.\nChết tiệt. Mình bó tay mất thôi.\nNếu nhờ phía Chủ tịch Kang giúp, biết đâu chúng ta lại tìm ra cách?\nHọ có cùng mối quan tâm, ông ấy sẽ không ngại ra mặt đâu.\nNhưng dù sao, đó cũng không phải vấn đề của ông ấy.\nPhải rồi. Tôi nghe nói anh chuẩn bị họp với bên quảng cáo.\nĐúng vậy.","ko":"법무팀장: 위에선 찍고 아래에선 튕기고\n법무팀장: 에이씨, 진짜 못 해 먹겠네 이씨, 쯧\n황석우: 강 회장님 쪽에서 더 푸시를 하면\n황석우: 실마리가 풀리지 않을까요?\n황석우: 서로 이권이 물려 있으니까 내 일처럼 나설 텐데요\n법무팀장: 내 일처럼 나서는 거지 내 일은 아니니까요\n법무팀장: 아, 대행사들하고 미팅 계획 있다고 들었습니다\n황석우: 네","en":"The higher-ups are hunting me down, and my juniors are blowing me off.\nDarn it. I can't do this anymore.\nDon't you think we'll find a way if Chairman Kang cooperates?\nThey have a vested interest, so he'll step in like it's his own issue.\nBut after all, it's not his own issue.\nRight. I heard you have a meeting with the agencies.\nYes.","text":"Cấp trên thì đâm chọc, cấp dưới thì không nghe lời.\nChết tiệt. Mình bó tay mất thôi.\nNếu nhờ phía Chủ tịch Kang giúp, biết đâu chúng ta lại tìm ra cách?\nHọ có cùng mối quan tâm, ông ấy sẽ không ngại ra mặt đâu.\nNhưng dù sao, đó cũng không phải vấn đề của ông ấy.\nPhải rồi. Tôi nghe nói anh chuẩn bị họp với bên quảng cáo.\nĐúng vậy.\\n법무팀장:  위에선 찍고 아래에선 튕기고\n법무팀장:  에이씨, 진짜 못 해 먹겠네 이씨, 쯧\n황석우:  강 회장님 쪽에서 더 푸시를 하면\n황석우:  실마리가 풀리지 않을까요?\n황석우:  서로 이권이 물려 있으니까 내 일처럼 나설 텐데요\n법무팀장:  내 일처럼 나서는 거지 내 일은 아니니까요\n법무팀장:  아, 대행사들하고 미팅 계획 있다고 들었습니다\n황석우:  네\\nThe higher-ups are hunting me down, and my juniors are blowing me off.\nDarn it. I can't do this anymore.\nDon't you think we'll find a way if Chairman Kang cooperates?\nThey have a vested interest, so he'll step in like it's his own issue.\nBut after all, it's not his own issue.\nRight. I heard you have a meeting with the agencies.\nYes.","sourceUid":"merged-mvkqjxus-25","uid":"merged-mvkqjxus-25","sourceNo":681,"originalSourceNo":681,"manualOrder":133,"workspaceFixedOrder":133,"lockedOrder":133,"orderLocked":true,"start":2391.569803,"end":2454.708926,"viRange":{"start":2391.569803,"end":2420.809138},"koRange":{"start":2427.046815,"end":2454.708926},"viRanges":[{"start":2391.569803,"end":2420.809138}],"koRanges":[{"start":2427.046815,"end":2454.708926}],"speakerSegments":[{"index":0,"start":2427.047,"end":2430.615,"text":"위에선 찍고 아래에선 튕기고","speed":1,"cueUid":"merged-mvkqjxus-25","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "},{"index":1,"start":2430.615,"end":2434.836,"text":"에이씨, 진짜 못 해 먹겠네 이씨, 쯧","speed":1,"cueUid":"merged-mvkqjxus-25","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "},{"index":2,"start":2434.836,"end":2440.028,"text":"강 회장님 쪽에서 더 푸시를 하면","speed":1,"cueUid":"merged-mvkqjxus-25","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":3,"start":2440.028,"end":2441.97,"text":"실마리가 풀리지 않을까요?","speed":1,"cueUid":"merged-mvkqjxus-25","speakerIds":["AGENCY-02
