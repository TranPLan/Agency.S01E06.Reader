should be making one.\nAnd you can do that?\nI'm not sure.\nI'm relying on the possibilities.\n\"Possibilities\"?","sourceUid":"merged-mvkv6ugy-6","uid":"merged-mvkv6ugy-6","sourceNo":688,"originalSourceNo":688,"manualOrder":134,"workspaceFixedOrder":134,"lockedOrder":134,"orderLocked":true,"start":2420.809138,"end":2472.00874,"viRange":{"start":2420.809138,"end":2438.707892},"koRange":{"start":2454.708926,"end":2472.00874},"viRanges":[{"start":2420.809138,"end":2438.707892}],"koRanges":[{"start":2454.708926,"end":2472.00874}],"speakerSegments":[{"index":0,"start":2454.709,"end":2457.963,"text":"좋은 방법 좀 찾으셨습니까?","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "},{"index":1,"start":2457.963,"end":2460.853,"text":"지금은 방법을 찾아야 할 상황이 아니라","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":2,"start":2460.853,"end":2464.349,"text":"만들어야 하는 상황이죠 만드실 순 있겠고요?","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["AGENCY-028","sp-mv5am8f1-23"],"speakerNames":["황석우","법무팀장"],"speakerLabel":"황석우, 법무팀장:  "},{"index":3,"start":2464.349,"end":2466.401,"text":"저야 모르죠","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":4,"start":2466.401,"end":2469.668,"text":"그저 가능성에 기대 보는 거지","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":5,"start":2469.668,"end":2472.009,"text":"가능성이라면…","speed":1,"cueUid":"merged-mvkv6ugy-6","speakerIds":["sp-mv5am8f1-23"],"speakerNames":["법무팀장"],"speakerLabel":"법무팀장:  "}]},{"id":134,"readerNo":135,"displayNo":135,"n":135,"cueNo":135,"uniqueCueNo":135,"finalCueNo":135,"originalDisplayNo":135,"type":"dialogue","vi":"Để che đậy một vụ bê bối,\nchúng ta phải trả thêm tiền cho báo chí và tăng phí quảng cáo lên.\nAnh nói đúng. Đằng nào cũng phải dùng đến tiền, tôi muốn tiêu cho hợp lý.\nÝ anh là sao?\nNgăn chặn một thông điệp tiêu cực là điều căn bản.\nChuyên nghiệp thực thụ là phải biết tạo ra thông điệp.\nThông điệp đó có thể sẽ dẫn dắt dư luận và thay đổi suy nghĩ của họ.","ko":"황석우: 부정적인 기사를 덮으려면\n황석우: 광고비 늘려서 언론에 돈 써야 하는 상황 아닙니까\n황석우: 그렇죠 어차피 쓸 돈이면 제대로 써 보자 싶어서\n비서: 무슨 말씀이신지\n황석우: 부정적인 메시지를 막는 건 기본이죠\n황석우: 진짜 꾼들은 메시지를 만들어 내죠\n황석우: 그 메시지가 모든 걸 뒤집을 여론을 만들어 낼 수도 있고요","en":"In order to cover this up,\nwe need to increase our ad exposure and pay the press.\nYou're right. Since we're spending the money, I want to spend it the right way.\nWhat do you mean?\nCovering up a bad message is a given.\nReal pros make up a message.\nAnd that message may lead to the public changing their thoughts.","text":"Để che đậy một vụ bê bối,\nchúng ta phải trả thêm tiền cho báo chí và tăng phí quảng cáo lên.\nAnh nói đúng. Đằng nào cũng phải dùng đến tiền, tôi muốn tiêu cho hợp lý.\nÝ anh là sao?\nNgăn chặn một thông điệp tiêu cực là điều căn bản.\nChuyên nghiệp thực thụ là phải biết tạo ra thông điệp.\nThông điệp đó có thể sẽ dẫn dắt dư luận và thay đổi suy nghĩ của họ.\\n황석우:  부정적인 기사를 덮으려면\n황석우:  광고비 늘려서 언론에 돈 써야 하는 상황 아닙니까\n황석우:  그렇죠 어차피 쓸 돈이면 제대로 써 보자 싶어서\n비서:  무슨 말씀이신지\n황석우:  부정적인 메시지를 막는 건 기본이죠\n황석우:  진짜 꾼들은 메시지를 만들어 내죠\n황석우:  그 메시지가 모든 걸 뒤집을 여론을 만들어 낼 수도 있고요\\nIn order to cover this up,\nwe need to increase our ad exposure and pay the press.\nYou're right. Since we're spending the money, I want to spend it the right way.\nWhat do you mean?\nCovering up a bad message is a given.\nReal pros make up a message.\nAnd that message may lead to the public changing their thoughts.","sourceUid":"merged-mvkveyr2-12","uid":"merged-mvkveyr2-12","sourceNo":696,"originalSourceNo":696,"manualOrder":135,"workspaceFixedOrder":135,"lockedOrder":135,"orderLocked":true,"start":2438.707892,"end":2496.346584,"viRange":{"start":2438.707892,"end":2463.122766},"koRange":{"start":2472.00874,"end":2496.346584},"viRanges":[{"start":2438.707892,"end":2463.122766}],"koRanges":[{"start o do a corporate PR.\nI have no idea why they want to.\nSame here. I have no idea why.\nI'm not in the mood for jokes.\nI'm not in the mood for advertisements either.\nThis is bad. You won't die.\nJust give up if you can't do it.\nThis presentation is important.\nAll presentations are important.\nThis is the end for me if I fail. So please…","text":"Tập đoàn Woowon muốn làm truyền thông doanh nghiệp.\nNhưng tôi không rõ sao họ làm vậy.\nĐúng đó. Tôi cũng chả hiểu sao họ làm vậy.\nTôi không có tâm trạng để đùa đâu.\nTôi cũng không có tâm trạng để làm quảng cáo đâu.\nLớn chuyện rồi. Cô không chết được đâu. Không làm được thì cứ từ bỏ đi.\nBuổi thầu này quan trọng lắm.\nBuổi thầu nào chẳng quan trọng.\nVụ này mà thất bại là tôi tiêu đời. Vậy nên xin anh…\\n고아인:  우원그룹에서 기업 PR을 한다고 하는데\n고아인:  왜 하려고 하는질 모르겠어요. 글쎄\n유정석:  그, 나도 왜 하려고 하는지 모르겠네\n고아인:  저 장난칠 기분 아니에요\n유정석:  나도 광고 생각 할 기분 아니에요. 큰일이네\n고아인:  야, 안 죽어. 못 하겠으면 그냥 포기해\n고아인, 운전기사:  이거 중요한 PT예요. PT는 다 중요하지\n고아인:  이거 날리면 저 끝이에요. 그니까 저 좀…\\nWoowon Group wants to do a corporate PR.\nI have no idea why they want to.\nSame here. I have no idea why.\nI'm not in the mood for jokes.\nI'm not in the mood for advertisements either.\nThis is bad. You won't die.\nJust give up if you can't do it.\nThis presentation is important.\nAll presentations are important.\nThis is the end for me if I fail. So please…","sourceUid":"merged-mvkzxt7j-37","uid":"merged-mvkzxt7j-37","sourceNo":740,"originalSourceNo":740,"manualOrder":143,"workspaceFixedOrder":143,"lockedOrder":143,"orderLocked":true,"start":2606.38907,"end":2674.594051,"viRange":{"start":2606.38907,"end":2648.43922},"koRange":{"start":2640.269741,"end":2674.594051},"viRanges":[{"start":2606.38907,"end":2648.43922}],"koRanges":[{"start":2640.269741,"end":2674.594051}],"speakerSegments":[{"index":0,"start":2640.27,"end":2645.181,"text":"우원그룹에서 기업 PR을 한다고 하는데","speed":1,"cueUid":"merged-mvkzxt7j-37","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1 ":"They are full of bad issues, so I can't understand why they want to do this right--\nI guess I have another stray cat to feed.\nSao? What? Maybe it's a lion, not a cat.\nWho? Me? This must be my fate.\nFine, tomorrow. I'll read the articles tomorrow morning.\nI'll pay you as a freelancer.","text":"Bên họ đang gặp đủ thứ rắc rối, nhưng tôi không thể hiểu nổi vì sao họ muốn làm vậy…\nTrời ạ! Tôi lại phải nuôi ăn một con mèo hoang nữa rồi.\nSao? Mà không phải mèo, là sư tử mới đúng.\nAi cơ? Tôi sao? Ôi cái số tôi. Được rồi, để mai. Sáng mai tôi sẽ đọc thử mấy bài báo.\nTôi sẽ trả công làm tự do cho anh.\\n고아인:  부정적 이슈가 가득한데 지금 시점에서 왜 기업 PR을 한다는지 도무지 이해가… 아\n유정석:  거둬 먹일 길고양이 한 마리 또 생겼네\n유정석:  네? 고양이가 아니라 사자인가\n고아인, 유정석:  누가요? 저요? 팔자인가…\n아유, 내일, 내일 그래, 내일\n유정석:  내일 일어나서 기사들 챙겨 볼게\n고아인:  돈 드릴게요, 프리랜서 비용\\nThey are full of bad issues, so I can't understand why they want to do this right--\nI guess I have another stray cat to feed.\nSao? What? Maybe it's a lion, not a cat.\nWho? Me? This must be my fate.\nFine, tomorrow. I'll read the articles tomorrow morning.\nI'll pay you as a freelancer.","sourceUid":"merged-mvl0aerw-43","uid":"merged-mvl0aerw-43","sourceNo":753,"originalSourceNo":753,"manualOrder":144,"workspaceFixedOrder":144,"lockedOrder":144,"orderLocked":true,"start":2653.85356,"end":2722.609016,"viRange":{"start":2653.85356,"end":2688.330153},"koRange":{"start":2687.3755,"end":2722.609016},"viRanges":[{"start":2653.85356,"end":2688.330153}],"koRanges":[{"start":2687.3755,"end":2722.609016}],"speakerSegments":[{"index":0,"start":2687.376,"end":2693.873,"text":"부정적 이슈가 가득한데 지금 시점에서 왜 기업 PR을 한다는지 도무지 이해가… 아","speed":1,"cueUid":"merged-mvl0aerw-43","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":2693.873,"end":2697.129,"text":"거둬 먹일 길고양이 한 마리 또 생겼네","speed":1,"cueUid":"merged-mvl0aerw-43","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":2,"start":2697.129,"end":2704.45,"text":"네? 고양이 al or something?\nHelp me come up with a concept.\nYou really don't change.\nI'll give you a call. It's cold at night. Go home and rest.","sourceUid":"merged-mvl0l1xu-48","uid":"merged-mvl0l1xu-48","sourceNo":762,"originalSourceNo":762,"manualOrder":145,"workspaceFixedOrder":145,"lockedOrder":145,"orderLocked":true,"start":2688.330153,"end":2742.187347,"viRange":{"start":2688.330153,"end":2708.471},"koRange":{"start":2722.609016,"end":2742.187347},"viRanges":[{"start":2688.330153,"end":2708.471}],"koRanges":[{"start":2722.609016,"end":2742.187347}],"speakerSegments":[{"index":0,"start":2722.609,"end":2727.588,"text":"야, 너 뭐 '고맙습니다 제가 밥 한번 살게요'","speed":1,"cueUid":"merged-mvl0l1xu-48","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":1,"start":2727.588,"end":2729.35,"text":"뭐, 그런 식으로 나와야 되는 거 아니냐?","speed":1,"cueUid":"merged-mvl0l1xu-48","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":2,"start":2729.35,"end":2731.318,"text":"컨셉만 좀 같이 잡아 주세요","speed":1,"cueUid":"merged-mvl0l1xu-48","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":3,"start":2731.318,"end":2736.458,"text":"너 참 안 변해","speed":1,"cueUid":"merged-mvl0l1xu-48","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "},{"index":4,"start":2736.458,"end":2742.187,"text":"전화드릴게요. 밤공기 차다. 들어가 쉬어","speed":1,"cueUid":"merged-mvl0l1xu-48","speakerIds":["AGENCY-013"],"speakerNames":["유정석"],"speakerLabel":"유정석:  "}]},{"id":145,"readerNo":146,"displayNo":146,"n":146,"cueNo":146,"uniqueCueNo":146,"finalCueNo":146,"originalDisplayNo":146,"type":"narration","vi":"[âm nhạc ấm áp]\n[cười]\n[Phát nhạc êm dịu]","ko":"[따뜻한 음악]\n[헛웃음]\n[차분한 음악이 흘러나온다]","en":"[warm music]\n[laughter]\n[Calm music plays]","text":"[âm nhạc ấm áp]\n[cười]\n[Phát nhạc êm dịu]\\n[따뜻한 음악]\n[헛웃음]\n[차분한 음악이 흘러나온다]\\n[warm music]\n[laughter]\n[Calm music plays]","sourceUid":"merged-mvl0p0fg-49","uid":"merged-mvl0p0fg-49","sourceNo" u want payback? Is there a way?\nAn agency doing a job even the legal team couldn't do?\nIs that it? But don't you also do political ads?\nYou even joined some campaigns.\nForget it. Just drink up. Chang-su, this was directly ordered by the chairman's father.\nIf you solve this, you'll rise up to another level.","sourceUid":"merged-mvl0sth6-55","uid":"merged-mvl0sth6-55","sourceNo":777,"originalSourceNo":777,"manualOrder":147,"workspaceFixedOrder":147,"lockedOrder":147,"orderLocked":true,"start":2723.780052,"end":2816.958831,"viRange":{"start":2723.780052,"end":2783.019961},"koRange":{"start":2758.624134,"end":2816.958831},"viRanges":[{"start":2723.780052,"end":2783.019961}],"koRanges":[{"start":2758.624134,"end":2816.958831}],"speakerSegments":[{"index":0,"start":2758.624,"end":2763.857,"text":"한 방 먹었다며 이대로 당하고 있을래?","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007"],"speakerNames":["김태완"],"speakerLabel":"김태완:  "},{"index":1,"start":2763.857,"end":2771.065,"text":"아님 갚아 줄래? 방법 있어?","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007","AGENCY-002"],"speakerNames":["김태완","최창수"],"speakerLabel":"김태완, 최창수:  "},{"index":2,"start":2786.102,"end":2789.828,"text":"법무 팀도 못 하는 일을 대행사가? 그래?","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007"],"speakerNames":["김태완"],"speakerLabel":"김태완:  "},{"index":3,"start":2789.828,"end":2794.46,"text":"너네 정치 광고도 하잖아 대선 때 캠프에도 들어가고","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007"],"speakerNames":["김태완"],"speakerLabel":"김태완:  "},{"index":4,"start":2803.5,"end":2804.761,"text":"그냥 술이나 마셔","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007"],"speakerNames":["김태완"],"speakerLabel":"김태완:  "},{"index":5,"start":2807.427,"end":2816.959,"text":"창수야, 이거 왕회장이 직접 오더 내린 건이다. 해결하면 노는 물 사이즈가 달라진다","speed":1,"cueUid":"merged-mvl0sth6-55","speakerIds":["AGENCY-007"],"speakerNames":["김태완"],"speakerLabel":"김태완:  "}]},{"id":147,"readerNo":148,"displayNo":148,"n":148,"cueNo":148,"un sing.\nI still can't wrap my head around it.\nWhy can't you live peacefully?\nI would've quit if I wanted peace.\nIt's been a while. How are things? Things were good until I saw your face.","text":"Cô nói ở công ty họ ghét nhau lắm mà. Sao lại đi chung xe chứ?\nVì Go A In dị lắm. Tôi biết cô ấy sẽ cố tình đi nhờ xe của Chang Su.\nCô nói vậy là sao? Phải đi cùng xe chứ, vì trốn tránh tức là thua.\nTôi vẫn không tài nào hiểu nổi.\nHai người không thể sống dễ dàng hơn à?\nNếu muốn dễ dàng, tôi đã bỏ việc.\nLâu không gặp. Cô vẫn ổn chứ?\nTôi vẫn ổn, cho đến khi gặp anh.\\nB상무:  회사에서 서로 못 잡아먹어서 안달이라며 차를 왜 같이 타고 오냐\n최정민:  고아인이 독종이라서 일부러 창수 차 얻어 타고 올 줄 알았지, 내가\nB상무:  뭔 소리야? 같은 차 타야지\n최정민:  피하면 지는 거니까\n최창수:  알다가도 모르겠다\n최창수:  거, 쉽게 좀 삽시다, 쉽게 쉽게 살 거면 딴 일 찾아야죠\n최창수:  오랜만, 살 만해?\n최정민:  아, 살 만했는데 간만에 네 얼굴 보니까, 야 영 그만 살고 싶다\\nYou said they hate each other.\nWhy would they carpool?\nThat's because A-in is a freak. I knew she'd carpool with him on purpose.\nWhat do you mean?\nThey carpooled here because by running away, you're losing.\nI still can't wrap my head around it.\nWhy can't you live peacefully?\nI would've quit if I wanted peace.\nIt's been a while. How are things? Things were good until I saw your face.","sourceUid":"merged-mvlo7bod-13","uid":"merged-mvlo7bod-13","sourceNo":834,"originalSourceNo":834,"manualOrder":156,"workspaceFixedOrder":156,"lockedOrder":156,"orderLocked":true,"start":2960.423706,"end":3026.79501,"viRange":{"start":2960.423706,"end":2999.547062},"koRange":{"start":2993.149896,"end":3026.79501},"viRanges":[{"start":2960.423706,"end":2999.547062}],"koRanges":[{"start":2993.149896,"end":3026.79501}],"speakerSegments":[{"index":0,"start":2993.15,"end":3003.992,"text":"회사에서 서로 못 잡아먹어서 안달이라며 차를 왜 같이 타고 오냐","speed":1,"cueUid":"merged-mvlo7bod-13","speakerIds":["sp-mvlol8te-19"],"speakerNames":["B상무"],"speakerLabel":"B상무:  "},{"index":1,"start":3003.992,"end":3009.191,"text":"고아인이 독종이라서 일부러 창수 차 얻어 타고 올 줄 알았지, 내가","speed":1,"cueUid":"merged-mvlo7bod-13","spea 잘났어 갑시다","en":"It makes me want to give up living.\nYou're as spiteful as ever.\nIt's been a while. It's good that we don't see often. I heard five agencies were invited.\nTwo dropped out. I really want to drop out too.\nMy agency wanted me to go as a courtesy.\nRight. \"Don't start an ad campaign.\" That's the only thing we can say. Don't you agree?\nYou guys can catch up. I'm going to work.\nStill the same. So full of herself. Let's go.","text":"Tự dưng thấy chán sống luôn.\nCô vẫn cay nghiệt như xưa. Lâu lắm không gặp anh.\nMay là chúng ta ít gặp. Tôi nghe nói có năm đội quảng cáo được mời.\nHai đội bỏ ngang rồi.\nTôi cũng muốn bỏ lắm.\nCông ty muốn tôi đến cho phải phép thôi.\nĐúng vậy. \"Giờ không phải lúc để quảng cáo.\"\nĐâu còn câu nào để nói ngoài câu này. Nhỉ?\nMọi người lên sau nhé. Tôi đi làm trước đây.\nCô ấy vẫn như xưa. Chỉ biết mình thôi. Ta đi nào.\\n최창수:  여전히 뻣뻣하네 오랜만입니다\nB상무:  자주 안 보면 좋지, 뭐\nB상무:  인바이트 다섯 회사라고 들었는데\n최정민:  두 군데는 드롭\nB상무:  아, 나도 드롭하고 싶은데 회사에서 인사 차원으로 들어가라네\n최정민:  그렇지?\n고아인:  '지금은 광고하지 마십시오'\n최정민:  이것 말곤 할 말 없잖아, 안 그래?\n고아인:  회포들 푸세요, 전 일하러 갑니다\n고아인:  여전해, 역시 지만 잘났어 갑시다\\nIt makes me want to give up living.\nYou're as spiteful as ever.\nIt's been a while. It's good that we don't see often. I heard five agencies were invited.\nTwo dropped out. I really want to drop out too.\nMy agency wanted me to go as a courtesy.\nRight. \"Don't start an ad campaign.\" That's the only thing we can say. Don't you agree?\nYou guys can catch up. I'm going to work.\nStill the same. So full of herself. Let's go.","sourceUid":"merged-mvloi8zq-17","uid":"merged-mvloi8zq-17","sourceNo":848,"originalSourceNo":848,"manualOrder":157,"workspaceFixedOrder":157,"lockedOrder":157,"orderLocked":true,"start":2999.547062,"end":3062.372806,"viRange":{"start":2999.547062,"end":3029.334531},"koRange":{"start":3026.79501,"end":3062.372806},"viRanges":[{"start":2999.547062,"end":3029.334531}],"koRanges":[{"start":3026.79501,"end":3062.372806}],"speakerSegments":[{"index": ả cho tôi. Chúng ta sẽ lập đội tác chiến cho dự án bên Woowon. Bốn người chúng ta sao?\nỪ, dự án này cũng khá khó nhằn.\nChúng ta cũng chưa biết đội có những ai.\nVậy giờ ta làm gì? Tổng hợp quảng cáo truyền thông doanh nghiệp.\nVà tiền lệ quốc tế… Không có đâu, nhỉ?\nĐúng, nước ngoài không có vụ nào tương tự đâu.\nTôi sẽ tổng hợp tài liệu về Woowon. Vậy tôi sẽ tìm tài liệu tham khảo.\nTrước mắt cứ thử xem sao. Kiểu gì khách hàng chả giao ý tưởng. Đúng nhỉ?","ko":"한병수: 내놔. 우원 건 있잖아\n서장우, 조은정: TF 팀 만들어서 가기로 했어 요렇게 넷 모여서요?\n한병수: 응, 워낙 어려운 건이기도 하고 아직 팀원들 배치도 못 받았으니까\n배원희: 일단 뭐부터 할까요?\n한병수: 일단 기업 PR 광고 좀 모으고 해외 사례…\n한병수, 조은정: 는 아니지? 그렇지, 없죠\n조은정: 이런 해외 사례는 제가 우원 쪽 자료 모을게요\n서장우: 그럼 저는 때깔 나는 레퍼런스\n한병수: 그래, 일단 해 보자 뭐, 광고주가 뭐라도 던져 주겠지. 그렇죠?","en":"Give it to me. We're forming a task force for the Woowon project. The four of us?\nYes, it's a difficult project.\nAnd we don't have our team members yet.\nWhat should we do first? Let's gather some corporate PR ads.\nAnd some foreign cases…\nNo, right? Yes, I don't think there's a case like this abroad.\nI'll gather the Woowon materials. Then I'll find some creative references.\nLet's just give it a go. I'm sure the client will give us an idea. Right?","text":"Trả cho tôi. Chúng ta sẽ lập đội tác chiến cho dự án bên Woowon. Bốn người chúng ta sao?\nỪ, dự án này cũng khá khó nhằn.\nChúng ta cũng chưa biết đội có những ai.\nVậy giờ ta làm gì? Tổng hợp quảng cáo truyền thông doanh nghiệp.\nVà tiền lệ quốc tế… Không có đâu, nhỉ?\nĐúng, nước ngoài không có vụ nào tương tự đâu.\nTôi sẽ tổng hợp tài liệu về Woowon. Vậy tôi sẽ tìm tài liệu tham khảo.\nTrước mắt cứ thử xem sao. Kiểu gì khách hàng chả giao ý tưởng. Đúng nhỉ?\\n한병수:  내놔. 우원 건 있잖아\n서장우, 조은정:  TF 팀 만들어서 가기로 했어 요렇게 넷 모여서요?\n한병수:  응, 워낙 어려운 건이기도 하고 아직 팀원들 배치도 못 받았으니까\n배원희:  일단 뭐부터 할까요?\n한병수:  일단 기업 PR 광고 좀 모으고 해외 사례…\n한병수, 조은정:  는 아니지? 그렇지, 없죠\n조은정:  이런 해외 사례는 제가 우원 쪽 자료 모을게요\n서장우:  그럼 저는 때깔 나는 레퍼런스\n한병수:  그래, 일단 해 보자 뭐, 광고주가 뭐라도 던져 주겠지. 그렇죠?\\nGive it to me. We're forming a task force for the Woowon project. The four of us?\nYes, it's a difficult project.\nAnd we don't have our team members yet.\nWhat should we do first? Let's gather some corporate PR ads.\nAnd some foreign cases…\nNo, right? Yes, I don't think there's a case like this abroad.\nI'll gather the Woowon materials. Then I'll find some creative references.\nLet's just give it a go. I'm sure the client will give us an idea. Right?","sourceUid":"merged-mvlououy-27","uid":"merged-mvlououy-27","sourceNo":865,"originalSourceNo":865,"manualOrder":158,"workspaceFixedOrder":158,"lockedOrder":158,"orderLocked":true,"start":3037.245203,"end":3108.17979,"viRange":{"start":3037.245203,"end":3072.774636},"koRange":{"start":3071.643373,"end":3108.17979},"viRanges":[{"start":3037.245203,"end":3072.774636}],"koRanges":[{"start":3071.643373,"end":3108.17979}],"speakerSegments":[{"index":0,"start":3071.643,"end":3076.684,"text":"내놔. 우원 건 있잖아","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":1,"start":3076.684,"end":3081.425,"text":"TF 팀 만들어서 가기로 했어 요렇게 넷 모여서요?","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-012","AGENCY-005"],"speakerNames":["서장우","조은정"],"speakerLabel":"서장우, 조은정:  "},{"index":2,"start":3081.425,"end":3085.993,"text":"응, 워낙 어려운 건이기도 하고 아직 팀원들 배치도 못 받았으니까","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":3,"start":3085.993,"end":3088.103,"text":"일단 뭐부터 할까요?","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-010"],"speakerNames":["배원희"],"speakerLabel":"배원희:  "},{"index":4,"start":3088.103,"end":3091.708,"text":"일단 기업 PR 광고 좀 모으고 해외 사례…","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "},{"index":5,"start":3091.708,"end":3095.569,"text":"는 아니지? 그렇지, 없죠","speed":1,"cueUid":"merged-mvlououy-27","speakerIds":["AGENCY-011","AGENCY-005"],"speaker ật tiến hành mua bán và sáp nhập, các công ty\nthường thực hiện truyền thông doanh nghiệp để làm đẹp hình ảnh.\nNếu tình huống này là như vậy…\nKhông phải vậy đâu. Sẽ không có chuyện đó.","ko":"황석우: 저희가 드릴 건 없습니다\n최정민: 기업 PR을 진행하는데 아무런 가이드가 없다고요?\nB상무: 네. 브리프도 없이 대행사에서 알아서 해 오라는 말씀이신가요?\n황석우: 네, 맞습니다\n최창수: 혹시 이런 말씀 실례가 아닐지 모르겠지만\n황석우: 뭐든지 괜찮습니다\n최창수: 큰 M&A를 준비 중이신 건 아니시고요?\n최창수: 비밀리에 M&A를 진행할 때 브랜드 가치 상승을 위해서\n최창수: 기업 PR을 하는 경우가 종종 있어서 드리는 말씀입니다\n최창수: 만약 그런 경우라면…\n황석우: 아닙니다 그런 계획 없습니다, 절대로","en":"We have nothing to give you.\nYou have no guidelines for a corporate PR?\nNo. You want the agency to come up with everything without a briefing?\nThat's right.\nI hope I'm not speaking out of line here, but…\nFeel free to speak.\nYou're not planning on an M&A, are you?\nWhen there's a covert M&A deal,\ncompanies sometimes do a corporate PR to boost their image.\nIf that were the case--\nThat's not the case here. We would never do that.","text":"Chúng tôi không có gì để nói.\nAnh không có hướng dẫn gì để tiến hành truyền thông doanh nghiệp?\nĐúng vậy. Anh muốn công ty quảng cáo tự làm mọi thứ mà không có mô tả dự án?\nĐúng là vậy.\nHi vọng anh không phật ý khi tôi nói điều này…\nAnh cứ thoải mái.\nKhông phải bên anh đang chuẩn bị mua bán và sáp nhập đấy chứ?\nKhi bí mật tiến hành mua bán và sáp nhập, các công ty\nthường thực hiện truyền thông doanh nghiệp để làm đẹp hình ảnh.\nNếu tình huống này là như vậy…\nKhông phải vậy đâu. Sẽ không có chuyện đó.\\n황석우:  저희가 드릴 건 없습니다\n최정민:  기업 PR을 진행하는데 아무런 가이드가 없다고요?\nB상무:  네. 브리프도 없이 대행사에서 알아서 해 오라는 말씀이신가요?\n황석우:  네, 맞습니다\n최창수:  혹시 이런 말씀 실례가 아닐지 모르겠지만\n황석우:  뭐든지 괜찮습니다\n최창수:  큰 M&A를 준비 중이신 건 아니시고요?\n최창수:  비밀리에 M&A를 진행할 때 브랜드 가치 상승을 위해서\n최창수:  기업 PR을 하는 경우가 종종 있어서 드리는 말씀입니다\n최창수:  만약 그런 경우라면…\n황석우:  아닙니다 그런 계획 없습니다, 절대로\\nWe have nothing to give you.\nYou have no guidelines for a corporate PR?\nNo. You want the agency to come up with everything without a briefing?\nThat's right.\nI hope I'm not speaking out of line here, but…\nFeel free to speak.\nYou're not planning on an M&A, are you?\nWhen there's a covert M&A deal,\ncompanies sometimes do a corporate PR to boost their image.\nIf that were the case--\nThat's not the case here. We would never do that.","sourceUid":"merged-mvlp3qvk-34","uid":"merged-mvlp3qvk-34","sourceNo":881,"originalSourceNo":881,"manualOrder":160,"workspaceFixedOrder":160,"lockedOrder":160,"orderLocked":true,"start":3072.774636,"end":3169.760197,"viRange":{"start":3072.774636,"end":3135.784886},"koRange":{"start":3108.17979,"end":3169.760197},"viRanges":[{"start":3072.774636,"end":3135.784886}],"koRanges":[{"start":3108.17979,"end":3169.760197}],"speakerSegments":[{"index":0,"start":3108.18,"end":3109.831,"text":"저희가 드릴 건 없습니다","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":1,"start":3115.451,"end":3121.044,"text":"기업 PR을 진행하는데 아무런 가이드가 없다고요?","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-016"],"speakerNames":["최정민"],"speakerLabel":"최정민:  "},{"index":2,"start":3121.044,"end":3127.47,"text":"네. 브리프도 없이 대행사에서 알아서 해 오라는 말씀이신가요?","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["sp-mvlol8te-19"],"speakerNames":["B상무"],"speakerLabel":"B상무:  "},{"index":3,"start":3127.47,"end":3128.651,"text":"네, 맞습니다","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":4,"start":3143.854,"end":3147.863,"text":"혹시 이런 말씀 실례가 아닐지 모르겠지만","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":5,"start":3147.863,"end":3149.662,"text":"뭐든지 괜찮습니다","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":6,"start":3149.662,"end":3154.074,"text":"큰 M&A를 준비 중이신 건 아니시고요?","speed":1,"cueUid":"merged-mvlp3qvk-34","speakerIds":["AGENCY-002"],"speakerNames":["최창수"],"speakerLabel":"최창수:  "},{"index":7,"start":  ích,\nchúng tôi sẽ sử dụng ngân sách đã hứa để tăng số lượng quảng cáo.\nSố quảng cáo đó cũng sẽ thuộc về đơn vị nào cung cấp ý tưởng tốt nhất.\nTrên lập trường của chúng tôi,\nchúng tôi cũng không mất gì.\nCác vị sẽ không gặp rủi ro gì cả. Tuy nhiên, sẽ không có nhiều thời gian.\nChúng tôi được chuẩn bị đề án trong mấy ngày? Các vị có một tuần. Sao?","ko":"황석우: 고 상무님 하실 말씀 있으시면 가감 없이 하시죠\n고아인: 상황이 워낙 특수한 상황이라서 계속 말씀하시죠\n고아인: 이번 기업 PR을 통해서 부정적인 여론이 형성될 수도 있을 텐데요\n황석우: 그 부분에 대해서는 대행사에 책임을 묻지 않겠습니다\n황석우: 더불어 쓸 만한 메시지가 나오지 않으면 약속했던 빌링은 기존 광고 물량 늘리는 데 쓰겠습니다\n황석우: 그 물량은 당연히 그 중에서 가장 좋은 걸 제안한\n황석우, 고아인: 대행사에 드리고요. 대행사 입장에서는 긍정적으로 봐도 되겠네요?\n리스크는 제거해 드렸습니다 근데 다만 시간이 넉넉지 않아서\nB상무: PT 기한이 며칠입니까?\n황석우: 일주일 드리겠습니다 네?","en":"Ms. Go. Please feel free to speak as you wish.\nThis case is a very special one.\nPlease continue. This may result in the public turning their backs on you.\nThe agency won't have to take responsibility for that.\nAlso, if a decent message isn't produced, we will use the billing we promised in increasing our ad quantities.\nAnd those ads will go to the agency that offered the best idea.\nSo from where we stand, we have nothing to lose.\nThere's no risk for you guys.\nHowever, there isn't much time.\nHow many days do we have to prepare for the presentation?\nYou have one week. Sorry?","text":"Giám đốc Go.\nNếu có gì muốn nói, cô cứ thoải mái lên tiếng.\nTình huống này cũng khá đặc biệt…\nCô nói tiếp đi.\nViệc truyền thông doanh nghiệp sẽ gây ra làn sóng dư luận tiêu cực.\nPhía công ty quảng cáo sẽ không cần chịu trách nhiệm cho việc đó.\nNgoài ra, nếu các vị không tạo ra thông điệp hữu ích,\nchúng tôi sẽ sử dụng ngân sách đã hứa để tăng số lượng quảng cáo.\nSố quảng cáo đó cũng sẽ thuộc về đơn vị nào cung cấp ý tưởng tốt nhất.\nTrên lập trường của chúng tôi,\nchúng tôi cũng không mất gì.\nCác vị sẽ không gặp rủi ro gì cả. Tuy nhiên, sẽ không có nhiều thời gian.\nChúng tôi được chuẩn bị đề án trong mấy ngày? Các vị có một tuần. Sao?\\n황석우:  고 상무님 하실 말씀 있으시면 가감 없이 하시죠\n고아인:  상황이 워낙 특수한 상황이라서 계속 말씀하시죠\n고아인:  이번 기업 PR을 통해서 부정적인 여론이 형성될 수도 있을 텐데요\n황석우:  그 부분에 대해서는 대행사에 책임을 묻지 않겠습니다\n황석우:  더불어 쓸 만한 메시지가 나오지 않으면 약속했던 빌링은 기존 광고 물량 늘리는 데 쓰겠습니다\n황석우:  그 물량은 당연히 그 중에서 가장 좋은 걸 제안한\n황석우, 고아인:  대행사에 드리고요. 대행사 입장에서는 긍정적으로 봐도 되겠네요?\n리스크는 제거해 드렸습니다 근데 다만 시간이 넉넉지 않아서\nB상무:  PT 기한이 며칠입니까?\n황석우:  일주일 드리겠습니다 네?\\nMs. Go. Please feel free to speak as you wish.\nThis case is a very special one.\nPlease continue. This may result in the public turning their backs on you.\nThe agency won't have to take responsibility for that.\nAlso, if a decent message isn't produced, we will use the billing we promised in increasing our ad quantities.\nAnd those ads will go to the agency that offered the best idea.\nSo from where we stand, we have nothing to lose.\nThere's no risk for you guys.\nHowever, there isn't much time.\nHow many days do we have to prepare for the presentation?\nYou have one week. Sorry?","sourceUid":"merged-mvlpfimd-43","uid":"merged-mvlpfimd-43","sourceNo":901,"originalSourceNo":901,"manualOrder":162,"workspaceFixedOrder":162,"lockedOrder":162,"orderLocked":true,"start":3135.784886,"end":3235.640832,"viRange":{"start":3135.784886,"end":3201.084188},"koRange":{"start":3172.578519,"end":3235.640832},"viRanges":[{"start":3135.784886,"end":3201.084188}],"koRanges":[{"start":3172.578519,"end":3235.640832}],"speakerSegments":[{"index":0,"start":3172.579,"end":3176.978,"text":"고 상무님 하실 말씀 있으시면 가감 없이 하시죠","speed":1,"cueUid":"merged-mvlpfimd-43","speakerIds":["AGENCY-028"],"speakerNames":["황석우"],"speakerLabel":"황석우:  "},{"index":1,"start":3181.747,"end":3184.72,"text":"상황이 워낙 특수한 상황이라서 계속 말씀하시죠","speed":1,"cueUid":"merged-mvlpfimd-43","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":2,"start":3184.72,"end":3194.597,"text":"이번 기업 PR을 통해서 부정적인 여론이 형성될 수도 있을 텐데요","speed":1,"cueUid":"merged-mvlpfimd-43","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":3,"start":3194.597,"end" eong.\nIsn't that right?\nWhat?","text":"Sao phải lo việc của Woowon?\nCô hỏi vậy là sao?\nCó việc thì ta phải làm chứ sao.\nNếu làm quảng cáo cho Woowon, vậy là Seo Jeong kèo trên, tôi kèo dưới.\nĐúng không?\nSao hả?\\n강한나:  우원 일을 우리가 왜 해?\n박영우:  왜 하냐니요?\n박영우:  일이 들어오면 하는 게 회사죠\n강한나:  우원 거 광고를 하면 서정이가 갑, 내가 을\n강한나:  맞잖아\\nWhy would we do Woowon's job?\n\"Why\"?\nWe work when there's work.\nIf I work with Woowon, that means I'd have to work for Seo-jeong.\nIsn't that right?\nWhat?","sourceUid":"merged-mvlpsysi-48","uid":"merged-mvlpsysi-48","sourceNo":910,"originalSourceNo":910,"manualOrder":167,"workspaceFixedOrder":167,"lockedOrder":167,"orderLocked":true,"start":3224.833351,"end":3271.330525,"viRange":{"start":3224.833351,"end":3242.192837},"koRange":{"start":3259.362865,"end":3271.330525},"viRanges":[{"start":3224.833351,"end":3242.192837}],"koRanges":[{"start":3259.362865,"end":3271.330525}],"speakerSegments":[{"index":0,"start":3259.363,"end":3260.902,"text":"우원 일을 우리가 왜 해?","speed":1,"cueUid":"merged-mvlpsysi-48","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":1,"start":3260.902,"end":3262.884,"text":"왜 하냐니요?","speed":1,"cueUid":"merged-mvlpsysi-48","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":2,"start":3262.884,"end":3265.279,"text":"일이 들어오면 하는 게 회사죠","speed":1,"cueUid":"merged-mvlpsysi-48","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":3,"start":3265.279,"end":3269.901,"text":"우원 거 광고를 하면 서정이가 갑, 내가 을","speed":1,"cueUid":"merged-mvlpsysi-48","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":4,"start":3269.901,"end":3271.331,"text":"맞잖아","speed":1,"cueUid":"merged-mvlpsysi-48","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "}]},{"id":167,"readerNo":168,"displayNo":168,"n":168,"cueNo":168,"uniqueCueNo":168,"finalCueNo":168,"originalDisplayNo":168,"type":"narration","vi":"[Âm nhạc thú vị]","ko":"[흥미로운 음악]","en":"[Interesting music]","text":"[Âm nhạc thú vị]\\n[흥미로운 음악]\\n[Interesting music]","sourceUid":"ko-mvcgclti-1869","uid":"ko-mvcgclti-1869","sourceNo":911,"originalSourceNo":911,"manualOrder":168,"workspaceFixedOrder":168,"lockedOrder":168,"orderLocked":true,"start":3295,"end":3297.66,"viRange":null,"koRange":null,"viRanges":[],"koRanges":[],"speakerSegments":[]},{"id":168,"readerNo":169,"displayNo":169,"n":169,"cueNo":169,"uniqueCueNo":169,"finalCueNo":169,"originalDisplayNo":169,"type":"dialogue","vi":"Đúng vậy, xét về mặt hợp đồng.\nThật không thể tin nổi.\nVị thế tài chính của tôi bỏ xa cậu ta.\nSao sói làm việc cho chó được?\nCách nói đó có vẻ không phù hợp.\nKhông chỗ nào? Chuẩn quá còn gì.\nKhông phải kèo dưới nào cũng giống nhau.\nCô chưa từng làm cho ai, nhỉ?","ko":"박영우: 맞죠, 계약상\n강한나: 씨, 세상이 어떻게 돌아가려고\n강한나: 아니, 내가 재계 서열이 한참 위잖아\n강한나: 늑대가 어떻게 개 밑에서 일을 하냐고\n박영우: 적절한 표현은 아닌 거 같은데요\n강한나: 뭐가 아니야, 아주 딱인데\n박영우: 이게 을도 다 같은 을이 아닌데\n박영우: 살면서 을인 적 없으셨죠?","en":"Right, according to the contract.\nThis is unbelievable.\nI'm way above her financially.\nHow can a wolf work for a dog?\nI don't think that's an accurate analogy.\nWhat do you mean? It's spot on.\nWorking for people isn't always the same.\nYou've never worked for someone, have you?","text":"Đúng vậy, xét về mặt hợp đồng.\nThật không thể tin nổi.\nVị thế tài chính của tôi bỏ xa cậu ta.\nSao sói làm việc cho chó được?\nCách nói đó có vẻ không phù hợp.\nKhông chỗ nào? Chuẩn quá còn gì.\nKhông phải kèo dưới nào cũng giống nhau.\nCô chưa từng làm cho ai, nhỉ?\\n박영우:  맞죠, 계약상\n강한나:  씨, 세상이 어떻게 돌아가려고\n강한나:  아니, 내가 재계 서열이 한참 위잖아\n강한나:  늑대가 어떻게 개 밑에서 일을 하냐고\n박영우:  적절한 표현은 아닌 거 같은데요\n강한나:  뭐가 아니야, 아주 딱인데\n박영우:  이게 을도 다 같은 을이 아닌데\n박영우:  살면서 을인 적 없으셨죠?\\nRight, according to the contract.\nThis is unbelievable.\nI'm way above her financially.\nHow can a wolf work for a dog?\nI don't think that's an accurate analogy.\nWhat do you mean? It's spot on.\nWorking for people isn't always the same.\nYou've never worked for someone, have you?","sourceUid":"merged-mvm5nl4k-54","uid":"merged-mvm5nl4k-54","sourceNo":919,"originalSourceNo":919,"manualOrder":169,"workspaceFixedOrder":169,"lockedOrder":169,"orderLocked":true,"start":3242.192837,"end":3297.880116,"viRange":{"start":3242.192837,"end":3264.512628},"koRange":{"start":3276.787955,"end":3297.880116},"viRanges":[{"start":3242.192837,"end":3264.512628}],"koRanges":[{"start":3276.787955,"end":3297.880116}],"speakerSegments":[{"index":0,"start":3276.788,"end":3278.541,"text":"맞죠, 계약상","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":1,"start":3278.541,"end":3281.281,"text":"씨, 세상이 어떻게 돌아가려고","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":2,"start":3281.281,"end":3283.475,"text":"아니, 내가 재계 서열이 한참 위잖아","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":3,"start":3283.475,"end":3285.617,"text":"늑대가 어떻게 개 밑에서 일을 하냐고","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":4,"start":3285.617,"end":3289.219,"text":"적절한 표현은 아닌 거 같은데요","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":5,"start":3289.219,"end":3291.149,"text":"뭐가 아니야, 아주 딱인데","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":6,"start":3291.149,"end":3295.32,"text":"이게 을도 다 같은 을이 아닌데","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":7,"start":3295.32,"end":3297.88,"text":"살면서 을인 적 없으셨죠?","speed":1,"cueUid":"merged-mvm5nl4k-54","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "}]},{"id":169,"readerNo":170,"displayNo":170,"n":170,"cueNo":170,"uniqueCueNo":170,"finalCueNo":170,"originalDisplayNo":170,"type":"dialogue","vi":"Chứ anh nghĩ sao?\nTôi nên giải thích thế nào đây?\nCô nghe này. Giả sử cánh tay cô bị ngứa, và tôi gãi hộ cô…\nSao anh lại gãi hộ tôi? Tôi tự gãi là được mà.\nĐúng đó, cô có thể tự gãi.\nVậy là cô không nợ tôi gì hết.\nNhưng nếu cô bị ngứa ở lưng thì sao?","ko":"박영우: 있겠어? 아, 이걸 어떻게 설명해 드려야 하나\n박영우: 자. 만약에 상무님 팔이 간지러운데\n박영우: 제가 긁어 주면?\n강한나: 박 차장이 내 팔을 왜 긁어?\n강한나: 내 손으로 하면 되지\n강한나: 그렇죠? 직접 하면 되죠. 그럼 저는 완전한 을이에요\n박영우: 근데 가려운 데가 등이면 어떻겠어요?","en":"What do you think?\nHow should I explain this?\nLook. Let's say that your arm is itchy. And if I scratch it for you…\nWhy would you scratch my arm? I can scratch myself.\nRight, you can do it yourself. So you don't owe me anything.\nBut what if your back itches?","text":"Chứ anh nghĩ sao?\nTôi nên giải thích thế nào đây?\nCô nghe này. Giả sử cánh tay cô bị ngứa, và tôi gãi hộ cô…\nSao anh lại gãi hộ tôi? Tôi tự gãi là được mà.\nĐúng đó, cô có thể tự gãi.\nVậy là cô không nợ tôi gì hết.\nNhưng nếu cô bị ngứa ở lưng thì sao?\\n박영우:  있겠어? 아, 이걸 어떻게 설명해 드려야 하나\n박영우:  자. 만약에 상무님 팔이 간지러운데\n박영우:  제가 긁어 주면?\n강한나:  박 차장이 내 팔을 왜 긁어?\n강한나:  내 손으로 하면 되지\n강한나:  그렇죠? 직접 하면 되죠. 그럼 저는 완전한 을이에요\n박영우:  근데 가려운 데가 등이면 어떻겠어요?\\nWhat do you think?\nHow should I explain this?\nLook. Let's say that your arm is itchy. And if I scratch it for you…\nWhy would you scratch my arm? I can scratch myself.\nRight, you can do it yourself. So you don't owe me anything.\nBut what if your back itches?","sourceUid":"merged-mvm5xiwg-59","uid":"merged-mvm5xiwg-59","sourceNo":930,"originalSourceNo":930,"manualOrder":170,"workspaceFixedOrder":170,"lockedOrder":170,"orderLocked":true,"start":3264.512628,"end":3329.007974,"viRange":{"start":3264.512628,"end":3296.454596},"koRange":{"start":3297.880116,"end":3329.007974},"viRanges":[{"start":3264.512628,"end":3296.454596}],"koRanges":[{"start":3297.880116,"end":3329.007974}],"speakerSegments":[{"index":0,"start":3298.622,"end :172,"displayNo":172,"n":172,"cueNo":172,"uniqueCueNo":172,"finalCueNo":172,"originalDisplayNo":172,"type":"dialogue","vi":"Ngứa điên lên được, nhưng cô lại không với đến. Rồi tôi gãi hộ cô thì sao?\nKhi đó người gãi mới thực sự là kèo trên. Quả là nhiệm màu.\nTrợ lý Park. Anh không có bạn gái, nhỉ?\nSao? Chắc chắn không có nhỉ?\nAnh chưa có và cũng không có ý định gặp gỡ ai đâu nhỉ?\nSao đột nhiên cô lại nói mấy câu ngớ ngẩn vậy?","ko":"박영우: 막 가려워 미치겠는데 손이 안 닿는 등을 제가 긁어 주면요?\n강한나: 아! 긁어 주는 사람이 갑이죠\n강한나: 역시 신묘해 박 차장, 여자 친구 없지?\n강한나: 예? 확실히 없지?\n강한나: 어제 생겼다거나 오늘 생길 예정이거나\n강한나: 그런 거 아니지?\n박영우: 아, 갑자기 무슨 뚱딴지같은 소릴 하세요","en":"It's driving you crazy, and your hands can't reach it.\nWhat if I scratch that for you?\nSo the one who scratches is more powerful.\nI knew you were a smart servant.\nMr. Park. You're single, right?\nSorry? I want to make sure.\nYou're not planning on dating someone anytime soon, right?\nWhy are you asking me such a weird question?","text":"Ngứa điên lên được, nhưng cô lại không với đến. Rồi tôi gãi hộ cô thì sao?\nKhi đó người gãi mới thực sự là kèo trên. Quả là nhiệm màu.\nTrợ lý Park. Anh không có bạn gái, nhỉ?\nSao? Chắc chắn không có nhỉ?\nAnh chưa có và cũng không có ý định gặp gỡ ai đâu nhỉ?\nSao đột nhiên cô lại nói mấy câu ngớ ngẩn vậy?\\n박영우:  막 가려워 미치겠는데 손이 안 닿는 등을 제가 긁어 주면요?\n강한나:  아! 긁어 주는 사람이 갑이죠\n강한나:  역시 신묘해 박 차장, 여자 친구 없지?\n강한나:  예? 확실히 없지?\n강한나:  어제 생겼다거나 오늘 생길 예정이거나\n강한나:  그런 거 아니지?\n박영우:  아, 갑자기 무슨 뚱딴지같은 소릴 하세요\\nIt's driving you crazy, and your hands can't reach it.\nWhat if I scratch that for you?\nSo the one who scratches is more powerful.\nI knew you were a smart servant.\nMr. Park. You're single, right?\nSorry? I want to make sure.\nYou're not planning on dating someone anytime soon, right?\nWhy are you asking me such a weird question?","sourceUid":"merged-mvm6a50z-66","uid":"merged-mvm6a50z-66","sourceNo":942,"originalSourceNo":942,"manualOrder":172,"workspaceFixedOrder":172,"lockedOrder":172,"orderLocked":true,"start":3296 ới người đã là của mình?\nĐây chính là cơ hội tuyệt vời để trêu đùa hai vị giám đốc kia. À, đong đưa kiểu đó.\nSao? Anh muốn đong đưa với tôi à? Không nên đùa giỡn với bát cơm của người khác đâu.\nBiết rồi. Sao nghiêm túc vậy?\\n박영우:  아… 상무님. 그건 안 됩니다. 저랑은 절대 안 돼요\n강한나:  뭔 소리야? 네? 내가 박 차장이랑 썸을 왜 타? 이미 내 건데\n강한나:  내 거랑 썸 타는 사람이 어디 있어?\n강한나:  요 상무 나부랭이들 속 태울 절호의 찬스인데\n박영우, 강한나:  아, 아, 그 썸이요? 왜? 딴 썸 탈래? 나랑?\n박영우, 강한수:  남의 밥줄 가지고 그렇게 장난치는 거 아닙니다. 알았어, 정색은\\nMs. Kang. We can't do that. Not with me.\nWhat do you mean? What? Why would I have a fling with you?\nYou're already mine.\nSo why would I have a fling with you?\nThis is a great chance to play games with the two managing directors. Oh, that. Why? You want to have a fling with me?\nYou shouldn't play with someone else's livelihood.\nFine. Why are you so serious?","sourceUid":"merged-mvmi0vsb-84","uid":"merged-mvmi0vsb-84","sourceNo":985,"originalSourceNo":985,"manualOrder":178,"workspaceFixedOrder":178,"lockedOrder":178,"orderLocked":true,"start":3406.401858,"end":3491.510722,"viRange":{"start":3406.401858,"end":3458.101087},"koRange":{"start":3440.786731,"end":3491.510722},"viRanges":[{"start":3406.401858,"end":3458.101087}],"koRanges":[{"start":3440.786731,"end":3491.510722}],"speakerSegments":[{"index":0,"start":3440.787,"end":3453.868,"text":"아… 상무님. 그건 안 됩니다. 저랑은 절대 안 돼요","speed":1,"cueUid":"merged-mvmi0vsb-84","speakerIds":["AGENCY-004"],"speakerNames":["박영우"],"speakerLabel":"박영우:  "},{"index":1,"start":3453.868,"end":3464.129,"text":"뭔 소리야? 네? 내가 박 차장이랑 썸을 왜 타? 이미 내 건데","speed":1,"cueUid":"merged-mvmi0vsb-84","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":2,"start":3464.129,"end":3466.509,"text":"내 거랑 썸 타는 사람이 어디 있어?","speed":1,"cueUid":"merged-mvmi0vsb-84","speakerIds":["AGENCY-003"],"speakerNames":["강한나"],"speakerLabel":"강한나:  "},{"index":3,"start":3466.509,"end":3472.288,"text":"요 상무 나부랭이들 속 태울 절호의 찬스인데","speed":1,"cueUid":"merged-mvmi0vsb-84","speakerIds":["AGENCY-003" et's talk in the office. All right.\nWhat did she say? I heard they've got nothing.\nThe client gave her nothing. They left everything to us. What?\nThis is an advertisement they'll never follow through.\nYou think so, right?","sourceUid":"merged-mvmir3t3-96","uid":"merged-mvmir3t3-96","sourceNo":1019,"originalSourceNo":1019,"manualOrder":182,"workspaceFixedOrder":182,"lockedOrder":182,"orderLocked":true,"start":3536.267827,"end":3575.251007,"viRange":{"start":3536.267827,"end":3575.251007},"koRange":null,"viRanges":[{"start":3536.267827,"end":3575.251007}],"koRanges":[],"speakerSegments":[{"index":0,"start":3570.481,"end":3581.888,"text":"그, 광고주 브리프 받으셨어요? 아니. 네? 없어. 대행사에서 알아서 해 오래","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-011","AGENCY-001"],"speakerNames":["한병수","고아인"],"speakerLabel":"한병수, 고아인:  "},{"index":1,"start":3581.888,"end":3587.98,"text":"아니, 무슨 그런 PT가… 들어가서 얘기하자. 일단 알겠습니다","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-011","AGENCY-001"],"speakerNames":["한병수","고아인"],"speakerLabel":"한병수, 고아인:  "},{"index":2,"start":3587.98,"end":3591.895,"text":"상무님이 뭐래요? 뭐 없다던데","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":3,"start":3591.895,"end":3597.877,"text":"어, 아무것도 안 주고 그냥 알아서 해 오랬대. 에?","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-011","AGENCY-005"],"speakerNames":["한병수","조은정"],"speakerLabel":"한병수, 조은정:  "},{"index":4,"start":3603.308,"end":3606.758,"text":"이거 그거네, 어차피 안 할 광고","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":5,"start":3606.758,"end":3608.844,"text":"그렇지, 그거 같지?","speed":1,"cueUid":"merged-mvmir3t3-96","speakerIds":["AGENCY-011"],"speakerNames":["한병수"],"speakerLabel":"한병수:  "}]},{"id":182,"readerNo":183,"displayNo":183,"n":183,"cueNo":183,"uniqueCueNo":183,"finalCueNo":183,"originalDisplayNo":183,"type":"dialogue","vi":"Chỉ là họ muốn kiểm tr On top of that… You have one week. …they only gave us a week.\nIt means they don't have the leisure to test our capacity.\nSo you want to test them?\nYes. I heard both of them are the best in the field.\nThat's not it. I'm testing what my grandpa told me.","text":"Giám đốc tập đoàn mời các công ty quảng cáo…\nXin chào. Tôi là Hwang Suk Woo, Giám đốc marketing của Woowon.\n…và đích thân ngồi họp với các bên.\nChưa kể… Các vị có một tuần. …chỉ cho một tuần để triển khai.\nTức là họ không đủ thời gian để kiểm tra năng lực các bên.\nVậy cô muốn kiểm tra họ sao?\nPhải. Tôi nghe nói cả hai người họ đều là tài năng đầu ngành.\nKhông phải cái đó. Tôi muốn kiểm tra theo lời khuyên của ông.\\n고아인:  전무가 인바이트한 대행사들 상대로\n황석우:  안녕하세요. 우원그룹 마케팅 전무 황석우입니다\n고아인:  직접 미팅을 진행했고\n고아인:  거기에 일주일 드리겠습니다. 기간을 일주일밖에 못 준다는 건\n고아인, 박영우:  실력을 테스트할 만큼 한가한 상황은 아니라는 건데. 테스트를 해 보신다는 거예요?\n박정숙, 강한나:  응. 두 분 다 실력은 업계 최고라고 하던데요. 그거 말고\n강한나:  할아버지가 해 준 조언 테스트\\nThe senior managing director invited the agencies…\nHello. I'm the Woowon Group marketing team's senior managing director, Hwang Suk-woo.\n…and had a meeting with them himself.\nOn top of that… You have one week. …they only gave us a week.\nIt means they don't have the leisure to test our capacity.\nSo you want to test them?\nYes. I heard both of them are the best in the field.\nThat's not it. I'm testing what my grandpa told me.","sourceUid":"merged-mvmjtf45-109","uid":"merged-mvmjtf45-109","sourceNo":1040,"originalSourceNo":1040,"manualOrder":184,"workspaceFixedOrder":184,"lockedOrder":184,"orderLocked":true,"start":3596.67786,"end":3638.557951,"viRange":{"start":3596.67786,"end":3638.557951},"koRange":null,"viRanges":[{"start":3596.67786,"end":3638.557951}],"koRanges":[],"speakerSegments":[{"index":0,"start":3630.989,"end":3634.44,"text":"전무가 인바이트한 대행사들 상대로","speed":1,"cueUid":"merged-mvmjtf45-109","speakerIds":["AGENCY-001"],"speakerNames":["고아인"],"speakerLabel":"고아인:  "},{"index":1,"start":3634.44,"end":3640.951,"text":"안녕하세요. 우원그룹 마케팅 전무 황  lần rồi mà.","ko":"고아인: 격려차 만나자고 하는 건 아닐 텐데\n최창수: 예비 사돈댁 일이라고 숟가락 얹으려는 건가?\n최창수: 하긴 뭐, 강한나도 회장님한테 성과를 보여 줘야겠지\n강한나: 당연하지 패배자 옆에 서 있었으면 재벌 될 수 있겠어?\n강한나: 우리는 언제나 똑같아 이기는 편 우리 편\n최창수: 25년 회사 생활 중에 딱 한 번의 실수 고아인 너인 거 같다\n고아인: 딱 한 번이요? 전 여러 번 봤는데?","en":"I'm sure she isn't meeting us to wish us good luck.\nIs she trying to ride coattails since they're her future in-laws?\nAfter all, Kang Han-na has to prove herself to the chairman.\nOf course. You can't stay a chaebol if you stand with the loser.\nWe always play by the same rule.\nThe winner is on my team.\nMy one and only mistake in my 25-year career is you, Go A-in.\n\"One and only\"? I've seen other mistakes.","text":"Chắc chắn cô ta không hẹn gặp để chúc may mắn.\nCô ta đang muốn hưởng lợi vì bên đó là thông gia tương lai sao?\nCũng phải, Kang Han Na cũng phải chứng tỏ bản thân với chủ tịch mà.\nTất nhiên rồi. Đâu thể làm tài phiệt nếu đứng cạnh kẻ thất bại.\nTrước sau vẫn như một thôi.\nPhe thắng chính là phe mình.\nSai lầm duy nhất trong suốt 25 năm sự nghiệp của tôi chắc chỉ có cô thôi, Go A In.\n\"Duy nhất\"? Tôi thấy nhiều lần rồi mà.\\n고아인:  격려차 만나자고 하는 건 아닐 텐데\n최창수:  예비 사돈댁 일이라고 숟가락 얹으려는 건가?\n최창수:  하긴 뭐, 강한나도 회장님한테 성과를 보여 줘야겠지\n강한나:  당연하지 패배자 옆에 서 있었으면 재벌 될 수 있겠어?\n강한나:  우리는 언제나 똑같아 이기는 편 우리 편\n최창수:  25년 회사 생활 중에 딱 한 번의 실수 고아인 너인 거 같다\n고아인:  딱 한 번이요? 전 여러 번 봤는데?\\nI'm sure she isn't meeting us to wish us good luck.\nIs she trying to ride coattails since they're her future in-laws?\nAfter all, Kang Han-na has to prove herself to the chairman.\nOf course. You can't stay a chaebol if you stand with the loser.\nWe always play by the same rule.\nThe winner is on my team.\nMy one and only mistake in my 25-year career is you, Go A-in.\n\"One and only\"? I've seen other mistakes.","sourceUid":"merged-mvmk836t-123","uid":"merged-mvmk836t-123","sourceNo":1063,"originalSourceNo":1063,"manualOrder":188,"workspaceFixedOrder":188,"lockedOrder":188,"orderLocked":true,"start":3669.81583,"end":3791.037969,"viRange":{"start": function side(){let L=split(blocks[cur]||{});$('vip').textContent=L.vi;$('kop').textContent=L.ko}

function play(kind,i=cur,token=++tok){return new Promise(async res=>{let r=getRange(kind,i);if(!r)return res();try{let a=await prepareEngine(kind,r.start);let end=Number(r.end||0);let done=false;let cleanup=()=>{a.removeEventListener('timeupdate',check);a.removeEventListener('ended',ended);a.removeEventListener('error',errored)};let finish=()=>{if(done)return;done=true;cleanup();a.pause();res()};let check=()=>{if(done)return;if(token!==tok||!flow&&token!==tok)return finish();if(a.currentTime>=end-0.03)finish()};let ended=()=>finish();let errored=()=>finish();a.addEventListener('timeupdate',check);a.addEventListener('ended',ended,{once:true});a.addEventListener('error',errored,{once:true});setMsg(`Đang phát ${kind.toUpperCase()} Cue #${label(blocks[i]||{},i)} ${fmt(r.start)} → ${fmt(r.end)}`);try{await a.play();}catch(e){cleanup();if(isIOS()&&!unlocked){alert('iPhone cần unlock audio trước. Bấm Unlock iPhone Audio rồi thử lại.')}else{alert('Không phát được audio: '+(e&&e.message?e.message:e));}return res()}setTimeout(check,80)}catch(e){alert(e.message||e);res()}})}
function playCurrent(k){stopAll(false);tok++;play(k,cur,tok)}
function sequenceFor(mode){if(mode==='vi')return['vi'];if(mode==='ko')return['ko'];if(mode==='vi-ko-vi')return['vi','ko','vi'];return['vi','ko']}
async function smart(){let token=++tok;flow=true;if(isIOS()&&!unlocked){let ok=await unlockAudio(false);if(!ok){alert('Trên iPhone, hãy bấm Unlock iPhone Audio trước, sau đó bấm Smart Flow.');flow=false;return}}let mode=$('mode').value, seq=sequenceFor(mode);for(let i=cur;i<blocks.length&&token===tok&&flow;i++){cur=i;render();document.querySelector('.seg.active')?.scrollIntoView({block:'center'});for(const k of seq){if(token!==tok||!flow)break;await play(k,i,token)}}if(token===tok)setMsg('Smart Flow đã dừng/kết thúc')}
function stopAll(inc=true){if(inc)tok++;flow=false;via.pause();koa.pause();engine.pause();setMsg('Đã stop')}
function next(){cur=Math.min(blocks.length-1,cur+1);render()}function prev(){cur=Math.max(0,cur-1);render()}
$('viaf').onchange=e=>{let f=e.target.files[0];if(f){via.src=URL.createObjectURL(f);applyVisibleVolume('vi');if(!engine.src){engine.src=via.src;engineKind='vi';applyEngineVolume('vi')}unlocked=false;setMsg('Đã chọn VI audio. Nếu dùng iPhone, bấm Unlock.')}};
$('koaf').onchange=e=>{let f=e.target.files[0];if(f){koa.src=URL.createObjectURL(f);applyVisibleVolume('ko');unlocked=false;setMsg('Đã chọn KO audio. Nếu dùng iPhone, bấm Unlock.')}};
function tryAuto(){let vu=candidateUrls('vi')[0], ku=candidateUrls('ko')[0]; if(vu)via.src=vu; if(ku)koa.src=ku; applyVisibleVolume('vi');applyVisibleVolume('ko'); try{via.load();koa.load();}catch(e){} setMsg('Đã khai báo audio từ GitHub. Nếu iPhone chưa nghe, chờ vài giây rồi bấm Unlock/Smart Flow.')}initReaderVolumeControls();tryAuto();
(function addIphoneButtons(){let row=document.querySelector('.float .row');if(row){let b=document.createElement('button');b.textContent='Unlock iPhone Audio';b.className='warn';b.onclick=()=>unlockAudio(true);row.insertBefore(b,row.children[3]||null);let d=document.createElement('button');d.textContent='Audio paths';d.onclick=()=>showAudioPaths();row.appendChild(d);}})();
render();</script></body></html>
